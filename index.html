<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCFD; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); }
        .animate-zoom { animation: zoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoom { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .battle-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en');
            const [selected, setSelected] = useState(null);

            // --- DATA: PARTICLES ---
            const particleGroups = [
                {
                    groupTitle: "The Big Three",
                    items: [
                        { p: 'wa', label: 'Topic', en: 'As for X...', hi: 'X ke baare mein...', logic: 'Sets the main stage. Speaking of X...', ex: 'Watashi wa Himanshu desu.' },
                        { p: 'ga', label: 'Subject', en: 'The Actor', hi: 'Karta (ne)', logic: 'Emphasis on WHO is doing the action.', ex: 'Watashi ga ikimasu.' },
                        { p: 'o', label: 'Object', en: 'The Target', hi: 'Karma (ko)', logic: 'The thing receiving the action.', ex: 'Kohii o nomimasu.' }
                    ]
                },
                {
                    groupTitle: "Movement & Direction",
                    items: [
                        { p: 'ni', label: 'Destination', en: 'To / At', hi: 'Sthan/Samay', logic: 'Focus on the final destination point.', ex: 'Nihon ni ikimasu.' },
                        { p: 'e', label: 'Direction', en: 'Towards', hi: 'Ki taraf', logic: 'Focus on the heading or journey.', ex: 'Gakkou e ikimasu.' },
                        { p: 'kara', label: 'Start', en: 'From', hi: 'Se (Shuru)', logic: 'Starting point in time/space.', ex: 'Indo kara kimashita.' },
                        { p: 'made', label: 'End', en: 'Until', hi: 'Tak (Ant)', logic: 'The end point.', ex: 'Go-ji made hatarakimasu.' }
                    ]
                }
            ];

            const multitaskers = [
                { 
                    p: 'de', 
                    title: 'The Swiss Army Knife', 
                    logic: 'DE is a versatile tool. It marks WHERE you do things, HOW you do them (tools), or the TOTAL cost/limit.',
                    roles: [
                        { name: 'Location', desc: 'Where action happens', ex: 'Toshokan DE yomimasu.' },
                        { name: 'Tool', desc: 'Means of action', ex: 'Hasu DE tabemasu.' },
                        { name: 'Total', desc: 'Sum or Limit', ex: 'Zenbu DE ikura desu ka?' }
                    ]
                },
                { 
                    p: 'NI vs DE', 
                    title: 'The Location Battle', 
                    logic: 'NI is for "Static" existence (sitting, staying, living). DE is for "Active" events (studying, eating, working).',
                    compare: [
                        { side: 'NI (Static)', desc: 'Existence/State', ex: 'Uchi NI imasu.' },
                        { side: 'DE (Active)', desc: 'Dynamic Action', ex: 'Uchi DE nemasu.' }
                    ]
                },
                { 
                    p: 'WA vs GA', 
                    title: 'The Emphasis Duel', 
                    logic: 'WA sets the topic (General info). GA points a finger at the subject (Specific info).',
                    compare: [
                        { side: 'WA (General)', desc: 'Focus on the predicate', ex: 'Inu wa kawaii.' },
                        { side: 'GA (Specific)', desc: 'Focus on the subject', ex: 'Inu ga naita!' }
                    ]
                }
            ];

            // --- DATA: KOSOADO ---
            const kosoado = [
                { id: 'item', title: "Objects", row: ["kore", "sore", "are", "dore"], logic: "Pronouns" },
                { id: 'place', title: "Places", row: ["koko", "soko", "asoko", "doko"], logic: "Locations" },
                { id: 'adj', title: "Adjectives", row: ["kono", "sono", "ano", "dono"], logic: "Need Noun" },
                { id: 'dir', title: "Direction", row: ["kochira", "sochira", "achira", "dochira"], logic: "Polite/Way" }
            ];

            const spatialDetails = {
                kore: { en: "This (near me)", hi: "Yeh", logic: "Near speaker.", ex: "Kore wa hon desu." },
                sore: { en: "That (near you)", hi: "Woh", logic: "Near listener.", ex: "Sore wa nan desu ka?" },
                are: { en: "That far away", hi: "Woh door", logic: "Far from both.", ex: "Are wa yama desu." },
                dore: { en: "Which one?", hi: "Kaunsa?", logic: "Questioning 3+ items.", ex: "Dore ga ii desu ka?" },
                koko: { en: "Here", hi: "Yahan", logic: "Current spot.", ex: "Koko ni kite." },
                soko: { en: "There", hi: "Wahan", logic: "Listener's spot.", ex: "Soko ni arimasu." },
                asoko: { en: "Over there", hi: "Door wahan", logic: "Distant spot.", ex: "Asoko desu." },
                doko: { en: "Where?", hi: "Kahan?", logic: "Asking location.", ex: "Doko desu ka?" },
                kono: { en: "This [X]", hi: "Yeh [X]", logic: "Adjective form.", ex: "Kono pen." },
                sono: { en: "That [X]", hi: "Woh [X]", logic: "Adjective form.", ex: "Sono kutsu." },
                ano: { en: "That far [X]", hi: "Woh door [X]", logic: "Adjective form.", ex: "Ano hito." },
                dono: { en: "Which [X]?", hi: "Kaunsa [X]?", logic: "Questioning noun.", ex: "Dono hon?" },
                kochira: { en: "This way", hi: "Is taraf", logic: "Polite direction.", ex: "Kochira e." },
                sochira: { en: "That way", hi: "Us taraf", logic: "Polite direction.", ex: "Sochira e." },
                achira: { en: "Far way", hi: "Door taraf", logic: "Polite direction.", ex: "Achira e." },
                dochira: { en: "Which way?", hi: "Kis taraf?", logic: "Polite questioning.", ex: "Dochira desu ka?" }
            };

            const counters = [
                { title: 'General (-tsu)', items: ['hitotsu', 'futatsu', 'mittsu', 'yottsu', 'itsutsu', 'muttsu', 'nanatsu', 'yattsu', 'kokonotsu', 'tooo'] },
                { title: 'People (-nin)', items: ['hitori ★', 'futari ★', 'san-nin', 'yo-nin ★', 'go-nin', 'roku-nin', 'shichi-nin'] },
                { title: 'Time (-ji)', items: ['ichi-ji', 'ni-ji', 'san-ji', 'yo-ji ★', 'go-ji', 'roku-ji', 'shichi-ji ★', 'hachi-ji'] }
            ];

            const verbGroups = [
                { title: 'Group 1 (Godan)', rule: 'u sound → i + masu', verbs: [
                    { dict: 'Iku', polite: 'Ikimasu', en: 'Go', hi: 'Jaana', ex: 'Kaisha ni ikimasu.' },
                    { dict: 'Nomu', polite: 'Nomimasu', en: 'Drink', hi: 'Peena', ex: 'Mizu o nomimasu.' },
                    { dict: 'Hanasu', polite: 'Hanashimasu', en: 'Speak', hi: 'Bolna', ex: 'Nihongo o hanashimasu.' }
                ]},
                { title: 'Group 2 (Ichidan)', rule: 'iru/eru → drop ru + masu', verbs: [
                    { dict: 'Taberu', polite: 'Tabemasu', en: 'Eat', hi: 'Khana', ex: 'Ranchi o tabemasu.' },
                    { dict: 'Miru', polite: 'Mimasu', en: 'Watch', hi: 'Dekhna', ex: 'Eiga o mimasu.' },
                    { dict: 'Neru', polite: 'Nemasu', en: 'Sleep', hi: 'Sona', ex: 'Juuji ni nemasu.' }
                ]},
                { title: 'Group 3 (Irregular)', rule: 'Memorize fixed forms', verbs: [
                    { dict: 'Suru', polite: 'Shimasu', en: 'Do', hi: 'Karna', ex: 'Benkyou o shimasu.' },
                    { dict: 'Kuru', polite: 'Kimasu', en: 'Come', hi: 'Aana', ex: 'Tomodachi ga kimasu.' }
                ]}
            ];

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    
                    {/* SIDEBAR */}
                    <aside className="hidden lg:flex w-24 bg-slate-950 flex-col items-center py-10 gap-10 fixed h-full z-50">
                        <div className="w-12 h-12 bg-rose-500 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg text-xl">N</div>
                        <nav className="flex flex-col gap-8">
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                            <SidebarBtn active={activeTab === 'kosoado'} icon="map" onClick={() => setActiveTab('kosoado')} />
                            <SidebarBtn active={activeTab === 'numbers'} icon="tag" onClick={() => setActiveTab('numbers')} />
                            <SidebarBtn active={activeTab === 'verbs'} icon="bolt" onClick={() => setActiveTab('verbs')} />
                        </nav>
                    </aside>

                    {/* MAIN */}
                    <main className="flex-1 lg:ml-24 pb-24">
                        <header className="sticky top-0 z-40 glass border-b border-slate-100 px-6 lg:px-12 py-6 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl lg:text-2xl font-extrabold tracking-tighter text-slate-900 italic uppercase leading-none tracking-tighter">Nihongono <span className="text-rose-500 font-black tracking-tighter">Sensei</span></h1>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">By Japa & Himanshu</p>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200 shadow-inner">
                                <button onClick={() => setBridge('en')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${bridge === 'en' ? 'bg-white shadow-md text-slate-900' : 'text-slate-400'}`}>EN</button>
                                <button onClick={() => setBridge('hi')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${bridge === 'hi' ? 'bg-white shadow-md text-rose-500' : 'text-slate-400'}`}>HI</button>
                            </div>
                        </header>

                        <div className="max-w-7xl mx-auto p-6 lg:p-12 space-y-20">
                            
                            {/* PARTICLES TAB */}
                            {activeTab === 'particles' && (
                                <div className="space-y-20 animate-zoom">
                                    {particleGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-rose-500 pl-4">{group.groupTitle}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {group.items.map((item, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="group bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all text-left h-56 relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-9xl italic group-hover:text-rose-50 uppercase leading-none">{item.p}</div>
                                                        <div className="relative z-10">
                                                            <p className="text-[10px] font-black text-rose-500 uppercase tracking-widest leading-none mb-1">{item.label}</p>
                                                            <h3 className="text-4xl font-black text-slate-900 italic uppercase mt-1 tracking-tighter group-hover:text-rose-600 transition-colors leading-none">{item.p}</h3>
                                                        </div>
                                                        <p className="text-slate-500 font-extrabold text-sm relative z-10 mt-auto">{bridge === 'en' ? item.en : item.hi}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}

                                    {/* MULTITASKER SECTION */}
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-amber-500 pl-4">Multitaskers & Confusions</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                            {multitaskers.map((mt, i) => (
                                                <button key={i} onClick={() => setSelected({type: 'multitask', data: mt})} className="battle-gradient p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group text-left transition-all hover:scale-[1.01] active:scale-[0.99]">
                                                    <div className="absolute -right-6 -top-6 text-white/5 text-[150px] font-black italic select-none group-hover:text-white/10 transition-colors">{mt.p.split(' ')[0]}</div>
                                                    <div className="relative z-10 space-y-8">
                                                        <div>
                                                            <p className="text-amber-400 font-black text-[10px] uppercase tracking-[0.2em] mb-2">{mt.title}</p>
                                                            <h3 className="text-4xl font-black text-white italic tracking-tighter uppercase leading-none">{mt.p}</h3>
                                                        </div>
                                                        <div className="flex items-center gap-2 text-white/40 text-[9px] font-black uppercase tracking-widest">
                                                            <span className="material-icons text-xs">touch_app</span> Click for Master Logic
                                                        </div>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* OTHER TABS */}
                            {activeTab === 'kosoado' && (
                                <div className="animate-zoom bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden">
                                    <div className="overflow-x-auto no-scrollbar">
                                        <table className="w-full text-left min-w-[800px]">
                                            <thead className="bg-slate-950 text-white text-[10px] uppercase font-black tracking-widest">
                                                <tr><th className="p-8">Category</th><th className="p-8 text-rose-400 font-black italic">KO</th><th className="p-8 text-blue-400 font-black italic">SO</th><th className="p-8 text-emerald-400 font-black italic">A</th><th className="p-8 text-amber-400 font-black italic">DO</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold">
                                                {kosoado.map((obj, i) => (
                                                    <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                                                        <td className="p-8 bg-slate-50 border-r border-slate-100">
                                                            <p className="text-xs font-black text-slate-900 uppercase">{obj.title}</p>
                                                            <p className="text-[9px] mt-2 text-slate-400 font-bold uppercase tracking-widest">{obj.logic}</p>
                                                        </td>
                                                        {obj.row.map((word, j) => (
                                                            <td key={j} className="p-4"><button onClick={() => setSelected({type: 'spatial', id: word})} className="w-full py-8 rounded-2xl hover:bg-rose-50 hover:text-rose-600 font-black text-2xl italic uppercase tracking-tighter transition-all">{word}</button></td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'numbers' && (
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 animate-zoom">
                                    {counters.map((group, i) => (
                                        <div key={i} className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm">
                                            <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-8">{group.title}</h3>
                                            <div className="flex flex-wrap gap-2.5">
                                                {group.items.map((it, j) => (
                                                    <span key={j} className={`px-4 py-2 rounded-xl text-xs font-bold italic border ${it.includes('★') ? 'bg-rose-50 border-rose-100 text-rose-600' : 'bg-slate-50 border-slate-100 text-slate-600'}`}>{it}</span>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {activeTab === 'verbs' && (
                                <div className="space-y-16 animate-zoom">
                                    {verbGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-rose-500 pl-4">{group.title}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                {group.verbs.map((v, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'verb', data: v})} className="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all text-left">
                                                        <h3 className="text-4xl font-black text-slate-900 italic leading-none">{v.dict}</h3>
                                                        <p className="text-slate-400 font-extrabold text-sm uppercase mt-4">{bridge === 'en' ? v.en : v.hi}</p>
                                                        <p className="text-xs text-rose-500 font-black mt-1 italic uppercase tracking-widest">Polite: {v.polite}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL SYSTEM */}
                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md" onClick={() => setSelected(null)}>
                            <div className="relative bg-white w-full max-w-xl rounded-[3.5rem] p-10 lg:p-14 shadow-2xl animate-zoom overflow-y-auto max-h-[90vh] no-scrollbar" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelected(null)} className="absolute top-10 right-10 text-slate-300 hover:text-slate-900 transition-colors"><span className="material-icons text-3xl">close</span></button>
                                
                                {selected.type === 'multitask' && (
                                    <div className="space-y-10">
                                        <div className="bg-slate-900 p-10 rounded-[2.5rem] text-center">
                                            <h4 className="text-6xl font-black text-amber-400 italic tracking-tighter uppercase leading-none">{selected.data.p}</h4>
                                            <p className="text-white/40 font-black uppercase text-[10px] tracking-widest mt-6 italic">{selected.data.title}</p>
                                        </div>
                                        <div className="space-y-4">
                                            <p className="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 border-b pb-2">Sensei Deep Logic</p>
                                            <div className="p-8 bg-slate-50 rounded-[2rem] border border-slate-100 italic font-bold text-lg text-slate-700">"{selected.data.logic}"</div>
                                            <div className="grid grid-cols-1 gap-3">
                                                {(selected.data.roles || selected.data.compare).map((item, j) => (
                                                    <div key={j} className="p-6 bg-rose-50 border border-rose-100 rounded-[1.5rem] group">
                                                        <p className="text-rose-500 font-black text-[10px] uppercase mb-1 tracking-widest">{item.name || item.side}</p>
                                                        <p className="text-slate-800 font-bold text-sm leading-snug">{item.desc}</p>
                                                        <p className="text-rose-900/40 font-black italic text-xs mt-2">Example: "{item.ex}"</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {selected.type === 'particle' && (
                                    <div className="space-y-8">
                                        <h4 className="text-7xl font-black italic text-rose-500 leading-none tracking-tighter uppercase">{selected.data.p}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl italic font-bold text-xl text-slate-700">"{selected.data.logic}"</div>
                                        <div className="p-10 bg-slate-950 text-white rounded-[2.5rem] font-black italic text-2xl leading-tight">"{selected.data.ex}"</div>
                                    </div>
                                )}

                                {selected.type === 'spatial' && (
                                    <div className="space-y-8 italic">
                                        <h4 className="text-7xl font-black italic text-rose-500 leading-none tracking-tighter uppercase">{selected.id}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 leading-snug">Logic: {spatialDetails[selected.id].logic}</div>
                                        <div className="p-8 bg-rose-50 rounded-3xl border border-rose-100 text-2xl font-black italic text-rose-900 leading-tight italic">"{spatialDetails[selected.id].ex}"</div>
                                    </div>
                                )}

                                {selected.type === 'verb' && (
                                    <div className="space-y-8 text-center">
                                        <h4 className="text-7xl font-black italic text-rose-500 tracking-tighter leading-none">{selected.data.dict}</h4>
                                        <div className="flex gap-4 justify-center">
                                            <span className="px-6 py-2 bg-slate-950 text-white rounded-xl text-xs font-black uppercase tracking-widest leading-none">Polite: {selected.data.polite}</span>
                                            <span className="px-6 py-2 bg-rose-50 text-rose-600 rounded-xl text-xs font-black uppercase tracking-widest leading-none">{bridge === 'en' ? selected.data.en : selected.data.hi}</span>
                                        </div>
                                        <div className="p-10 bg-slate-50 rounded-[3rem] border border-slate-100 italic font-black text-3xl text-slate-800 leading-tight">"{selected.data.ex}"</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* MOBILE NAV BOTTOM */}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-950 px-10 py-5 rounded-full shadow-2xl flex gap-10 lg:hidden z-50">
                        <MobileBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                        <MobileBtn active={activeTab === 'kosoado'} icon="map" onClick={() => setActiveTab('kosoado')} />
                        <MobileBtn active={activeTab === 'numbers'} icon="tag" onClick={() => setActiveTab('numbers')} />
                        <MobileBtn active={activeTab === 'verbs'} icon="bolt" onClick={() => setActiveTab('verbs')} />
                    </nav>

                </div>
            );
        };

        const SidebarBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`p-2 lg:p-4 rounded-2xl transition-all duration-300 ${active ? 'bg-rose-500 text-white shadow-xl shadow-rose-500/30' : 'text-slate-500 hover:text-slate-300'}`}>
                <span className="material-icons text-3xl">{icon}</span>
            </button>
        );

        const MobileBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`transition-all duration-300 ${active ? 'text-rose-500 scale-125' : 'text-slate-500'}`}>
                <span className="material-icons text-2xl">{icon}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
