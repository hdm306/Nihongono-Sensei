<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .animate-zoom { animation: zoomIn 0.3s ease-out; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('calendar');
            const [bridge, setBridge] = useState('en');

            const weekdays = [
                { romaji: 'Getsu-youbi', en: 'Monday', hi: 'Somvaar', element_en: 'Moon', element_hi: 'Chandra' },
                { romaji: 'Ka-youbi', en: 'Tuesday', hi: 'Mangalvaar', element_en: 'Fire', element_hi: 'Agni/Mangal' },
                { romaji: 'Sui-youbi', en: 'Wednesday', hi: 'Budhvaar', element_en: 'Water', element_hi: 'Jal' },
                { romaji: 'Moku-youbi', en: 'Thursday', hi: 'Guruvaar', element_en: 'Wood', element_hi: 'Lakdi/Ped' },
                { romaji: 'Kin-youbi', en: 'Friday', hi: 'Shukravaar', element_en: 'Gold/Metal', element_hi: 'Sona/Dhatu' },
                { romaji: 'Do-youbi', en: 'Saturday', hi: 'Shanivaar', element_en: 'Earth', element_hi: 'Prithvi/Matti' },
                { romaji: 'Nichi-youbi', en: 'Sunday', hi: 'Ravivaar', element_en: 'Sun', element_hi: 'Surya' }
            ];

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    
                    {/* SIDEBAR */}
                    <aside className="w-full lg:w-28 bg-slate-900 flex lg:flex-col items-center p-6 gap-8 sticky top-0 z-50">
                        <div className="w-12 h-12 bg-teal-500 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg text-xl">N</div>
                        <nav className="flex-1 flex lg:flex-col gap-6">
                            <SidebarBtn active={activeTab === 'calendar'} icon="calendar_today" onClick={() => setActiveTab('calendar')} />
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                        </nav>
                    </aside>

                    {/* MAIN CONTENT */}
                    <main className="flex-1 p-6 lg:p-12">
                        <header className="flex justify-between items-center mb-12">
                            <div>
                                <h1 className="text-3xl font-black text-slate-900 tracking-tighter italic uppercase">Nihongono <span className="text-teal-600">Sensei</span></h1>
                                <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Master Dashboard</p>
                            </div>
                            
                            {/* LANGUAGE TOGGLE */}
                            <div className="flex bg-slate-200 p-1 rounded-xl">
                                <button onClick={() => setBridge('en')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${bridge === 'en' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}>ENGLISH</button>
                                <button onClick={() => setBridge('hi')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${bridge === 'hi' ? 'bg-white text-teal-600 shadow-sm' : 'text-slate-500'}`}>HINGLISH</button>
                            </div>
                        </header>

                        {activeTab === 'calendar' && (
                            <div className="animate-zoom max-w-2xl mx-auto lg:mx-0">
                                <div className="bg-white rounded-[2.5rem] p-8 lg:p-12 shadow-xl border border-slate-100 relative overflow-hidden">
                                    {/* Decorative background element */}
                                    <div className="absolute -right-10 -top-10 text-slate-50 text-[200px] font-black italic pointer-events-none select-none uppercase">Day</div>
                                    
                                    <div className="relative z-10">
                                        <div className="flex items-center gap-3 mb-10">
                                            <div className="w-1 bg-teal-500 h-8 rounded-full"></div>
                                            <h2 className="text-2xl font-black text-slate-800 italic uppercase tracking-tight">Weekdays</h2>
                                        </div>

                                        <div className="space-y-4">
                                            {weekdays.map((item, idx) => (
                                                <div key={idx} className="group flex items-center justify-between p-5 rounded-2xl bg-slate-50 hover:bg-teal-50 transition-all border border-transparent hover:border-teal-100">
                                                    <div className="flex items-center gap-6">
                                                        <div className="w-12 h-12 rounded-xl bg-white shadow-sm flex items-center justify-center font-black text-teal-600 group-hover:scale-110 transition-transform uppercase italic">
                                                            {item.romaji.charAt(0)}
                                                        </div>
                                                        <div>
                                                            <p className="text-lg font-black text-slate-900 italic tracking-tighter uppercase">{item.romaji}</p>
                                                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mt-0.5">
                                                                {bridge === 'en' ? item.en : item.hi}
                                                            </p>
                                                        </div>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-[9px] font-black text-teal-500 uppercase tracking-[0.2em] mb-1">Elemental Logic</p>
                                                        <p className="text-sm font-black text-slate-700 italic uppercase tracking-tighter">
                                                            {bridge === 'en' ? item.element_en : item.element_hi}
                                                        </p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const SidebarBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`p-4 rounded-2xl transition-all ${active ? 'bg-teal-500 text-white shadow-lg shadow-teal-500/20' : 'text-slate-500 hover:bg-slate-800'}`}>
                <span className="material-icons text-2xl">{icon}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
