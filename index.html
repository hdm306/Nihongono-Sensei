<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei - Official</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#FDFCFD]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en'); 
            const [selectedParticle, setSelectedParticle] = useState('wa');
            const [userInput, setUserInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [chatMessages, setChatMessages] = useState([
                { role: 'ai', text: "Konnichiwa! I am your Sensei. Ask me anything about Japanese!" }
            ]);
            const chatEndRef = useRef(null);

            // --- API KEY ---
            const apiKey = "AIzaSyDTRM2SWKlPmXz3q_UtnDNp7Xpjatg_a-0"; 

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [chatMessages, activeTab]);

            const particleGroups = {
                "The Big Three": [
                    { p: 'wa', label: 'Topic', en: 'As for X...', hi: 'X ke baare mein...' },
                    { p: 'ga', label: 'Subject', en: 'The actor.', hi: 'Karta (ne)' },
                    { p: 'o', label: 'Object', en: 'The target.', hi: 'Karma (ko)' }
                ],
                "Social": [
                    { p: 'ka', label: 'Question', en: '?', hi: 'Kya?' },
                    { p: 'ne', label: 'Right?', en: 'Right?', hi: 'Na?' }
                ]
            };

            const askSensei = async () => {
                if (!userInput.trim()) return;
                const msg = userInput;
                setUserInput('');
                setChatMessages(prev => [...prev, { role: 'user', text: msg }]);
                setIsTyping(true);

                const lang = bridge === 'hi' ? "Hinglish (Hindi+English)" : "English";
                const fullPrompt = `You are a Japanese Sensei. Respond to the user in ${lang}. Be brief and explain particles. Question: ${msg}`;

                try {
                    // Using the v1beta endpoint with gemini-1.5-flash which is the most forgiving combination
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: fullPrompt }] }]
                        })
                    });
                    
                    const data = await response.json();
                    if (data.error) throw new Error(`${data.error.status}: ${data.error.message}`);

                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sensei is silent.";
                    setChatMessages(prev => [...prev, { role: 'ai', text: aiText }]);
                } catch (err) {
                    setChatMessages(prev => [...prev, { role: 'ai', text: `Sensei Error: ${err.message}` }]);
                } finally { setIsTyping(false); }
            };

            return (
                <div className="min-h-screen text-slate-900 pb-20">
                    <nav className="sticky top-0 z-50 bg-white/90 border-b p-4 flex justify-between items-center">
                        <h1 className="text-xl font-black uppercase italic">Nihongono <span className="text-rose-500">Sensei</span></h1>
                        <div className="flex bg-slate-100 p-1 rounded-lg">
                            <button onClick={() => setBridge('en')} className={`px-3 py-1 text-[10px] font-bold rounded ${bridge === 'en' ? 'bg-white shadow-sm' : ''}`}>EN</button>
                            <button onClick={() => setBridge('hi')} className={`px-3 py-1 text-[10px] font-bold rounded ${bridge === 'hi' ? 'bg-white shadow-sm' : ''}`}>HI</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4 md:p-10">
                        <div className="flex justify-center gap-4 mb-10">
                            <button onClick={() => setActiveTab('particles')} className={`px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest ${activeTab === 'particles' ? 'bg-slate-900 text-white' : 'bg-slate-100'}`}>Lessons</button>
                            <button onClick={() => setActiveTab('ai')} className={`px-6 py-3 rounded-full text-xs font-black uppercase tracking-widest ${activeTab === 'ai' ? 'bg-indigo-600 text-white' : 'bg-slate-100'}`}>AI Lab</button>
                        </div>

                        {activeTab === 'particles' && (
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 animate-in">
                                {Object.entries(particleGroups).map(([name, items], i) => (
                                    <div key={i} className="bg-white rounded-3xl border p-6 shadow-sm">
                                        <h3 className="text-[10px] font-black uppercase text-rose-500 mb-4">{name}</h3>
                                        <div className="space-y-4">
                                            {items.map((item, j) => (
                                                <div key={j} className="flex items-center gap-4">
                                                    <span className="text-xl font-black italic">{item.p}</span>
                                                    <span className="text-xs text-slate-500">{bridge === 'en' ? item.en : item.hi}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'ai' && (
                            <div className="h-[500px] bg-white rounded-3xl shadow-2xl border flex flex-col overflow-hidden animate-in">
                                <div className="flex-1 p-6 overflow-y-auto space-y-4 no-scrollbar">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-4 rounded-2xl text-sm max-w-[85%] ${m.role === 'user' ? 'bg-slate-900 text-white' : 'bg-slate-100'}`}>{m.text}</div>
                                        </div>
                                    ))}
                                    {isTyping && <p className="text-[10px] font-black text-rose-500 animate-pulse">SENSEI DRAFTING...</p>}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-4 border-t flex gap-2">
                                    <input type="text" value={userInput} onChange={e => setUserInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && askSensei()} className="flex-1 bg-slate-50 rounded-xl px-4 py-3 text-sm outline-none focus:ring-2 focus:ring-rose-500" placeholder="Ask Sensei..." />
                                    <button onClick={askSensei} className="bg-rose-500 text-white px-6 py-3 rounded-xl font-bold">Send</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
