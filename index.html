<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Personal Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCFD; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); }
        .animate-zoom { animation: zoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoom { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .battle-gradient { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [userName, setUserName] = useState(localStorage.getItem('nihongo_user') || '');
            const [tempName, setTempName] = useState('');
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en');
            const [selected, setSelected] = useState(null);

            const handleNameSubmit = (e) => {
                e.preventDefault();
                if (tempName.trim()) {
                    localStorage.setItem('nihongo_user', tempName);
                    setUserName(tempName);
                }
            };

            const pEx = (text) => {
                if (!userName) return text;
                return text.replace(/Himanshu|Tanaka-san|User/g, `${userName}-san`);
            };

            // --- DATA ENGINE ---
            const particleGroups = [
                {
                    groupTitle: "Essential Basics",
                    items: [
                        { p: 'wa', label: 'Topic', en: 'As for X...', hi: 'X ke baare mein...', logic: 'Sets the topic. Focus is on what follows.', ex: 'Watashi wa Himanshu desu.' },
                        { p: 'ga', label: 'Subject', en: 'The Actor', hi: 'Karta (ne)', logic: 'Points to the specific actor. Focus is on WHO.', ex: 'Himanshu ga ikimasu.' },
                        { p: 'o', label: 'Object', en: 'The Target', hi: 'Karma (ko)', logic: 'Marks the thing receiving the action.', ex: 'Kohii o nomimasu.' }
                    ]
                },
                {
                    groupTitle: "Movement & Time",
                    items: [
                        { p: 'ni', label: 'Target', en: 'To / At', hi: 'Sthan/Samay', logic: 'Points to a static destination or time.', ex: 'Nihon ni ikimasu.' },
                        { p: 'e', label: 'Direction', en: 'Towards', hi: 'Ki taraf', logic: 'Focus on the journey/heading.', ex: 'Gakkou e ikimasu.' },
                        { p: 'kara', label: 'Start', en: 'From', hi: 'Se (Shuru)', logic: 'Starting point.', ex: 'Indo kara kimashita.' },
                        { p: 'made', label: 'End', en: 'Until', hi: 'Tak (Ant)', logic: 'Ending point.', ex: 'San-ji made hatarakimasu.' }
                    ]
                },
                {
                    groupTitle: "Useful Connectors",
                    items: [
                        { p: 'no', label: 'Linker', en: "Possession", hi: 'Ka/Ke/Ki', logic: 'Connects nouns (A no B).', ex: 'Watashi no tomodachi.' },
                        { p: 'mo', label: 'Also', en: 'Too / Also', hi: 'Bhi', logic: 'Inclusion of similar items.', ex: 'Watashi mo ikimasu.' },
                        { p: 'to', label: 'With', en: 'Together', hi: 'Aur / Saath', logic: 'Doing with someone or a full list.', ex: 'Tanaka-san to hanashimasu.' },
                        { p: 'soshite', label: 'And Then', en: 'Next', hi: 'Aur phir', logic: 'Linking sentences sequentially.', ex: 'Tabemasu. Soshite nemasu.' }
                    ]
                }
            ];

            const multitaskers = [
                { 
                    p: 'WA vs GA', title: 'Emphasis Duel', 
                    logic: 'WA sets the general topic. GA points a finger at the specific person/thing.',
                    compare: [
                        { side: 'WA (Info focus)', desc: 'Focus is on what is being said.', ex: 'Inu wa kawaii. (Dogs are cute - general fact)' },
                        { side: 'GA (Actor focus)', desc: 'Focus is on WHICH dog/person.', ex: 'Inu ga kita! (A dog came! - specific event)' }
                    ]
                },
                { 
                    p: 'NI vs E', title: 'Destination Logic', 
                    logic: 'NI is the destination (The goal). E is the direction (The journey).',
                    compare: [
                        { side: 'NI (Destination)', desc: 'Focus on arriving at the point.', ex: 'Nihon NI iku. (Goal is Japan)' },
                        { side: 'E (Direction)', desc: 'Focus on the act of heading there.', ex: 'Nihon E iku. (Heading toward Japan)' }
                    ]
                },
                { 
                    p: 'DE', title: 'The Multi-Tool', 
                    logic: 'DE marks the location where an action happens, a tool used, or a total amount.',
                    roles: [
                        { name: 'Location', desc: 'Where action occurs', ex: 'Resutoran DE taberu.' },
                        { name: 'Tool/Means', desc: 'By what method', ex: 'Kuruma DE ikimasu. (By car)' },
                        { name: 'Total', desc: 'The sum of items', ex: 'Zenbu DE 1000-en.' }
                    ]
                }
            ];

            const verbGroups = [
                { title: 'Group 1 (Godan)', rule: 'u → i + masu', verbs: [
                    { dict: 'Iku', polite: 'Ikimasu', en: 'Go', hi: 'Jaana', ex: 'Kaisha ni ikimasu.' },
                    { dict: 'Nomu', polite: 'Nomimasu', en: 'Drink', hi: 'Peena', ex: 'Mizu o nomimasu.' }
                ]},
                { title: 'Group 2 (Ichidan)', rule: 'iru/eru → drop ru', verbs: [
                    { dict: 'Taberu', polite: 'Tabemasu', en: 'Eat', hi: 'Khana', ex: 'Gohan o tabemasu.' },
                    { dict: 'Miru', polite: 'Mimasu', en: 'Watch', hi: 'Dekhna', ex: 'Eiga o mimasu.' }
                ]}
            ];

            const kosoado = [
                { id: 'item', title: "Objects", row: ["kore", "sore", "are", "dore"], logic: "Pronouns" },
                { id: 'place', title: "Places", row: ["koko", "soko", "asoko", "doko"], logic: "Locations" },
                { id: 'adj', title: "Adjectives", row: ["kono", "sono", "ano", "dono"], logic: "Need Noun" }
            ];

            const spatialDetails = {
                kore: { en: "This", hi: "Yeh", logic: "Near me.", ex: "Kore wa Himanshu no pen desu." },
                sore: { en: "That", hi: "Woh", logic: "Near you.", ex: "Sore wa nan desu ka?" },
                koko: { en: "Here", hi: "Yahan", logic: "My spot.", ex: "Koko wa Himanshu no uchi desu." }
            };

            const counters = [
                { title: 'General', items: ['hitotsu', 'futatsu', 'mittsu', 'yottsu', 'itsutsu'] },
                { title: 'People', items: ['hitori ★', 'futari ★', 'san-nin', 'yo-nin ★', 'go-nin'] }
            ];

            if (!userName) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-center">
                        <div className="max-w-md w-full bg-white rounded-[3rem] p-10 shadow-2xl animate-zoom">
                            <div className="w-16 h-16 bg-rose-500 rounded-2xl flex items-center justify-center text-white mx-auto mb-6 shadow-xl">
                                <span className="material-icons text-3xl">school</span>
                            </div>
                            <h2 className="text-2xl font-black text-slate-900 uppercase italic">Konnichiwa!</h2>
                            <p className="text-slate-400 font-bold text-[10px] uppercase tracking-widest mt-2 mb-8">Personalize your Japanese lab</p>
                            <form onSubmit={handleNameSubmit} className="space-y-4">
                                <input type="text" placeholder="Enter Name..." className="w-full bg-slate-100 py-4 px-6 rounded-xl text-lg font-bold outline-none text-center" value={tempName} onChange={(e) => setTempName(e.target.value)} autoFocus />
                                <button className="w-full bg-slate-900 text-white py-4 rounded-xl font-black uppercase hover:bg-rose-600 transition-all shadow-lg">Start Learning</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    <aside className="hidden lg:flex w-24 bg-slate-950 flex-col items-center py-10 gap-10 fixed h-full z-50">
                        <div className="w-12 h-12 bg-rose-500 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg text-xl">N</div>
                        <nav className="flex flex-col gap-8">
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                            <SidebarBtn active={activeTab === 'kosoado'} icon="map" onClick={() => setActiveTab('kosoado')} />
                            <SidebarBtn active={activeTab === 'numbers'} icon="tag" onClick={() => setActiveTab('numbers')} />
                            <SidebarBtn active={activeTab === 'verbs'} icon="bolt" onClick={() => setActiveTab('verbs')} />
                        </nav>
                        <button onClick={() => {localStorage.clear(); window.location.reload();}} className="mt-auto text-slate-600 hover:text-rose-500"><span className="material-icons">logout</span></button>
                    </aside>

                    <main className="flex-1 lg:ml-24 pb-24">
                        <header className="sticky top-0 z-40 glass border-b border-slate-100 px-6 lg:px-12 py-6 flex justify-between items-center">
                            <h1 className="text-xl lg:text-2xl font-extrabold tracking-tighter text-slate-900 italic uppercase">Nihongono <span className="text-rose-500 font-black">Sensei</span></h1>
                            <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Okaeri, {userName}!</p>
                        </header>

                        <div className="max-w-7xl mx-auto p-6 lg:p-12 space-y-20">
                            {activeTab === 'particles' && (
                                <div className="space-y-20 animate-zoom">
                                    {particleGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-rose-500 pl-4">{group.groupTitle}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {group.items.map((item, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="group bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all text-left h-56 relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-9xl italic group-hover:text-rose-50 uppercase leading-none">{item.p}</div>
                                                        <div className="relative z-10">
                                                            <p className="text-[10px] font-black text-rose-500 uppercase mb-1 tracking-widest">{item.label}</p>
                                                            <h3 className="text-4xl font-black text-slate-900 italic uppercase mt-1 tracking-tighter">{item.p}</h3>
                                                        </div>
                                                        <p className="text-slate-500 font-extrabold text-sm relative z-10 mt-auto">{bridge === 'en' ? item.en : item.hi}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}

                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-amber-500 pl-4">Face-Off & Multitaskers</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                            {multitaskers.map((mt, i) => (
                                                <button key={i} onClick={() => setSelected({type: 'multitask', data: mt})} className="battle-gradient p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group text-left transition-all hover:scale-[1.01]">
                                                    <div className="absolute -right-6 -top-6 text-white/5 text-[150px] font-black italic select-none uppercase leading-none">{mt.p.split(' ')[0]}</div>
                                                    <div className="relative z-10 space-y-4">
                                                        <p className="text-amber-400 font-black text-[10px] uppercase tracking-[0.2em]">{mt.title}</p>
                                                        <h3 className="text-4xl font-black text-white italic tracking-tighter uppercase leading-none">{mt.p}</h3>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'kosoado' && (
                                <div className="animate-zoom bg-white rounded-[2.5rem] border border-slate-100 shadow-xl overflow-hidden">
                                    <div className="overflow-x-auto no-scrollbar">
                                        <table className="w-full text-left min-w-[800px]">
                                            <thead className="bg-slate-950 text-white text-[10px] uppercase font-black tracking-widest">
                                                <tr><th className="p-8">Type</th><th className="p-8 text-rose-400 font-black italic">KO</th><th className="p-8 text-blue-400 font-black italic">SO</th><th className="p-8 text-emerald-400 font-black italic">A</th><th className="p-8 text-amber-400 font-black italic">DO</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold">
                                                {kosoado.map((obj, i) => (
                                                    <tr key={i} className="hover:bg-slate-50/50 transition-colors">
                                                        <td className="p-8 bg-slate-50 border-r border-slate-100"><p className="text-xs font-black text-slate-900 uppercase">{obj.title}</p></td>
                                                        {obj.row.map((word, j) => (
                                                            <td key={j} className="p-4"><button onClick={() => setSelected({type: 'spatial', id: word})} className="w-full py-8 rounded-2xl hover:bg-rose-50 hover:text-rose-600 font-black text-2xl italic uppercase tracking-tighter transition-all">{word}</button></td>
                                                        ))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'numbers' && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-8 animate-zoom">
                                    {counters.map((group, i) => (
                                        <div key={i} className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-sm">
                                            <h3 className="text-[11px] font-black text-slate-400 uppercase tracking-widest mb-8">{group.title}</h3>
                                            <div className="flex flex-wrap gap-2.5">
                                                {group.items.map((it, j) => (<span key={j} className={`px-4 py-2 rounded-xl text-xs font-bold border italic ${it.includes('★') ? 'bg-rose-50 border-rose-100 text-rose-600' : 'bg-slate-50 border-slate-100 text-slate-600'}`}>{it}</span>))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {activeTab === 'verbs' && (
                                <div className="space-y-16 animate-zoom">
                                    {verbGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-rose-500 pl-4">{group.title}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                {group.verbs.map((v, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'verb', data: v})} className="bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all text-left">
                                                        <h3 className="text-4xl font-black text-slate-900 italic tracking-tighter leading-none">{v.dict}</h3>
                                                        <p className="text-slate-400 font-extrabold text-sm uppercase mt-4 italic">Polite: {v.polite}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL SYSTEM */}
                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md" onClick={() => setSelected(null)}>
                            <div className="relative bg-white w-full max-w-xl rounded-[3.5rem] p-10 lg:p-14 shadow-2xl animate-zoom overflow-y-auto max-h-[90vh] no-scrollbar" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelected(null)} className="absolute top-10 right-10 text-slate-300 hover:text-slate-900"><span className="material-icons text-3xl">close</span></button>
                                
                                {selected.type === 'multitask' && (
                                    <div className="space-y-10">
                                        <div className="bg-slate-900 p-8 rounded-[2rem] text-center">
                                            <h4 className="text-6xl font-black text-amber-400 italic tracking-tighter uppercase leading-none">{selected.data.p}</h4>
                                            <p className="text-white/40 font-black uppercase text-[9px] tracking-widest mt-4">Deep Logic for {userName}</p>
                                        </div>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 italic border border-slate-100">"{selected.data.logic}"</div>
                                        <div className="grid grid-cols-1 gap-3">
                                            {(selected.data.roles || selected.data.compare).map((item, j) => (
                                                <div key={j} className="p-6 bg-rose-50 border border-rose-100 rounded-[1.5rem]">
                                                    <p className="text-rose-500 font-black text-[10px] uppercase mb-1">{item.name || item.side}</p>
                                                    <p className="text-slate-800 font-bold text-sm leading-snug">{item.desc}</p>
                                                    <p className="text-rose-900/40 font-black italic text-xs mt-2 italic">"{pEx(item.ex)}"</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {selected.type === 'particle' && (
                                    <div className="space-y-8">
                                        <h4 className="text-7xl font-black italic text-rose-500 leading-none tracking-tighter uppercase">{selected.data.p}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 italic border border-slate-100">"{selected.data.logic}"</div>
                                        <div className="p-10 bg-slate-950 text-white rounded-[2.5rem] font-black italic text-2xl leading-tight italic">"{pEx(selected.data.ex)}"</div>
                                    </div>
                                )}

                                {selected.type === 'verb' && (
                                    <div className="space-y-8 text-center">
                                        <h4 className="text-7xl font-black italic text-rose-500 tracking-tighter leading-none">{selected.data.dict}</h4>
                                        <div className="p-10 bg-slate-50 rounded-[3rem] border border-slate-100 italic font-black text-3xl text-slate-800">"{pEx(selected.data.ex)}"</div>
                                    </div>
                                )}

                                {selected.type === 'spatial' && spatialDetails[selected.id] && (
                                    <div className="space-y-8">
                                        <h4 className="text-7xl font-black italic text-rose-500 leading-none tracking-tighter uppercase">{selected.id}</h4>
                                        <div className="p-8 bg-rose-50 rounded-3xl border border-rose-100 text-2xl font-black italic text-rose-900 leading-tight">"{pEx(spatialDetails[selected.id].ex)}"</div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-950 px-10 py-5 rounded-full shadow-2xl flex gap-10 lg:hidden z-50 border border-white/10">
                        <MobileBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                        <MobileBtn active={activeTab === 'kosoado'} icon="map" onClick={() => setActiveTab('kosoado')} />
                        <MobileBtn active={activeTab === 'numbers'} icon="tag" onClick={() => setActiveTab('numbers')} />
                        <MobileBtn active={activeTab === 'verbs'} icon="bolt" onClick={() => setActiveTab('verbs')} />
                    </nav>
                </div>
            );
        };

        const SidebarBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`p-4 rounded-2xl transition-all duration-300 ${active ? 'bg-rose-500 text-white shadow-xl' : 'text-slate-500 hover:text-slate-300'}`}>
                <span className="material-icons text-3xl">{icon}</span>
            </button>
        );

        const MobileBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`transition-all duration-300 ${active ? 'text-rose-500 scale-125' : 'text-slate-500'}`}>
                <span className="material-icons text-2xl">{icon}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
