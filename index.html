<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Particle Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCFD; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); }
        .animate-zoom { animation: zoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoom { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en');
            const [selected, setSelected] = useState(null);

            // --- COMPREHENSIVE PARTICLE DATA ---
            const particleGroups = [
                {
                    groupTitle: "The Big Three",
                    items: [
                        { p: 'wa', label: 'Topic', en: 'As for X...', hi: 'X ke baare mein...', logic: 'Sets the main stage. Highlights the topic of conversation.', ex: 'Watashi wa Himanshu desu.' },
                        { p: 'ga', label: 'Subject', en: 'The Actor', hi: 'Karta (ne)', logic: 'Emphasis on the specific person/thing doing the action.', ex: 'Watashi ga ikimasu.' },
                        { p: 'o', label: 'Object', en: 'The Target', hi: 'Karma (ko)', logic: 'Marks the item being acted upon by a verb.', ex: 'Kohii o nomimasu.' }
                    ]
                },
                {
                    groupTitle: "Movement & Direction",
                    items: [
                        { p: 'ni', label: 'Destination', en: 'To / At', hi: 'Sthan/Samay', logic: 'Focus on the final destination or a specific point in time.', ex: 'Nihon ni ikimasu.' },
                        { p: 'e', label: 'Direction', en: 'Towards', hi: 'Ki taraf', logic: 'Focus on the heading or the journey towards a place.', ex: 'Gakkou e ikimasu.' },
                        { p: 'de', label: 'Context', en: 'At (Action)', hi: 'Kriya Sthan', logic: 'Where the action takes place (doing something).', ex: 'Toshokan de yomimasu.' },
                        { p: 'kara', label: 'Start', en: 'From', hi: 'Se (Shuru)', logic: 'The starting point in time or space.', ex: 'Indo kara kimashita.' },
                        { p: 'made', label: 'End', en: 'Until', hi: 'Tak (Ant)', logic: 'The end point in time or space.', ex: 'Go-ji made hatarakimasu.' }
                    ]
                },
                {
                    groupTitle: "Connectors & Inclusive",
                    items: [
                        { p: 'no', label: 'Linker', en: "Possession", hi: 'Ka/Ke/Ki', logic: 'Connects two nouns. X owns or describes Y.', ex: 'Watashi no tomodachi.' },
                        { p: 'mo', label: 'Also', en: 'Too / Also', hi: 'Bhi', logic: 'Used to include something similar to what was mentioned.', ex: 'Watashi mo ikimasu.' },
                        { p: 'to', label: 'With / And', en: 'Together', hi: 'Aur / Saath', logic: 'Complete list of items or doing something with someone.', ex: 'Tomodachi to hanashimasu.' },
                        { p: 'soshite', label: 'Connector', en: 'And then', hi: 'Aur phir', logic: 'Used to link two sentences or sequential actions.', ex: 'Gohan o tabemasu. Soshite nemasu.' }
                    ]
                }
            ];

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    
                    {/* SIDEBAR */}
                    <aside className="hidden lg:flex w-24 bg-slate-950 flex-col items-center py-10 gap-10 fixed h-full z-50">
                        <div className="w-12 h-12 bg-rose-500 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg text-xl">N</div>
                        <nav className="flex flex-col gap-8">
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                            <SidebarBtn active={activeTab === 'kosoado'} icon="map" onClick={() => setActiveTab('kosoado')} />
                            <SidebarBtn active={activeTab === 'numbers'} icon="tag" onClick={() => setActiveTab('numbers')} />
                            <SidebarBtn active={activeTab === 'verbs'} icon="bolt" onClick={() => setActiveTab('verbs')} />
                        </nav>
                    </aside>

                    {/* MAIN */}
                    <main className="flex-1 lg:ml-24 pb-24">
                        <header className="sticky top-0 z-40 glass border-b border-slate-100 px-6 lg:px-12 py-6 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl lg:text-2xl font-extrabold tracking-tighter text-slate-900 italic uppercase">Nihongono <span className="text-rose-500 font-black">Sensei</span></h1>
                                <p className="text-[9px] font-bold text-slate-400 uppercase tracking-widest mt-1">Language Lab v2.0</p>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200 shadow-inner">
                                <button onClick={() => setBridge('en')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${bridge === 'en' ? 'bg-white shadow-md text-slate-900' : 'text-slate-400'}`}>ENGLISH</button>
                                <button onClick={() => setBridge('hi')} className={`px-4 py-1.5 rounded-lg text-[10px] font-black transition-all ${bridge === 'hi' ? 'bg-white shadow-md text-rose-500' : 'text-slate-400'}`}>HINDI</button>
                            </div>
                        </header>

                        <div className="max-w-7xl mx-auto p-6 lg:p-12">
                            {activeTab === 'particles' && (
                                <div className="space-y-16 animate-zoom">
                                    {particleGroups.map((group, gIdx) => (
                                        <div key={gIdx} className="space-y-6">
                                            <div className="border-l-4 border-rose-500 pl-6 py-1">
                                                <h2 className="text-2xl font-black text-slate-900 italic uppercase tracking-tighter">{group.groupTitle}</h2>
                                            </div>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {group.items.map((item, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="group bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all text-left flex flex-col justify-between h-56 relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-9xl italic group-hover:text-rose-50 transition-colors uppercase leading-none">{item.p}</div>
                                                        <div className="relative z-10">
                                                            <p className="text-[10px] font-black text-rose-500 uppercase tracking-widest">{item.label}</p>
                                                            <h3 className="text-5xl font-black text-slate-900 italic uppercase mt-1 tracking-tighter group-hover:text-rose-600 transition-colors leading-none">{item.p}</h3>
                                                        </div>
                                                        <p className="text-slate-500 font-extrabold text-sm relative z-10">{bridge === 'en' ? item.en : item.hi}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL */}
                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md">
                            <div className="relative bg-white w-full max-w-xl rounded-[3.5rem] p-10 lg:p-14 shadow-2xl animate-zoom">
                                <button onClick={() => setSelected(null)} className="absolute top-10 right-10 text-slate-300 hover:text-slate-900 transition-colors"><span className="material-icons text-3xl">close</span></button>
                                
                                <div className="space-y-8">
                                    <div className="flex items-center gap-8">
                                        <div className="text-8xl font-black italic text-rose-500 tracking-tighter uppercase leading-none">{selected.data.p}</div>
                                        <div>
                                            <h4 className="text-2xl font-black text-slate-900 italic uppercase leading-none">{selected.data.label}</h4>
                                            <p className="text-slate-400 font-black uppercase text-[10px] tracking-widest mt-2">Sensei Bridge</p>
                                        </div>
                                    </div>

                                    <div className="space-y-6">
                                        <div className="p-8 bg-slate-50 rounded-[2.5rem] border border-slate-100 shadow-inner">
                                            <p className="text-[10px] font-black text-rose-500 uppercase tracking-widest mb-3">Logic</p>
                                            <p className="text-xl font-bold text-slate-700 italic leading-snug">"{selected.data.logic}"</p>
                                        </div>
                                        <div className="p-10 bg-slate-950 text-white rounded-[3rem] border border-white/10 shadow-xl">
                                            <p className="text-[10px] font-black text-rose-400 uppercase tracking-widest mb-3">Sentence</p>
                                            <p className="text-2xl font-black italic tracking-wide leading-tight">"{selected.data.ex}"</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MOBILE NAV */}
                    <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-950 px-10 py-5 rounded-full shadow-2xl flex gap-12 lg:hidden z-50 border border-white/10">
                        <MobileBtn active={activeTab === 'particles'} icon="layers" onClick={() => setActiveTab('particles')} />
                        <MobileBtn active={activeTab === 'kosoado'} icon="map" onClick={() => setActiveTab('kosoado')} />
                        <MobileBtn active={activeTab === 'numbers'} icon="tag" onClick={() => setActiveTab('numbers')} />
                        <MobileBtn active={activeTab === 'verbs'} icon="bolt" onClick={() => setActiveTab('verbs')} />
                    </nav>

                </div>
            );
        };

        const SidebarBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`p-4 rounded-2xl transition-all duration-300 ${active ? 'bg-rose-500 text-white shadow-xl shadow-rose-500/30' : 'text-slate-500 hover:text-slate-300'}`}>
                <span className="material-icons text-3xl">{icon}</span>
            </button>
        );

        const MobileBtn = ({ active, icon, onClick }) => (
            <button onClick={onClick} className={`transition-all duration-300 ${active ? 'text-rose-500 scale-125' : 'text-slate-500'}`}>
                <span className="material-icons text-2xl">{icon}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
