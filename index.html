<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei - Final Fix</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#FDFCFD]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en'); 
            const [selectedKoso, setSelectedKoso] = useState('item');
            const [selectedParticle, setSelectedParticle] = useState('wa');
            const [userInput, setUserInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [chatMessages, setChatMessages] = useState([
                { role: 'ai', text: "Konnichiwa! I am your Sensei. I will explain Japanese using short, easy-to-read Hinglish or English logic. Ask me anything!" }
            ]);
            const chatEndRef = useRef(null);

            // --- API KEY ---
            const apiKey = "AIzaSyDTRM2SWKlPmXz3q_UtnDNp7Xpjatg_a-0"; 

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [chatMessages, activeTab, selectedParticle]);

            const particleGroups = {
                "The Big Three": [
                    { p: 'wa', label: 'Topic', en: 'As for X...', hi: 'X ke baare mein...' },
                    { p: 'ga', label: 'Subject', en: 'The specific actor.', hi: 'Karta (ne - ने)' },
                    { p: 'o', label: 'Object', en: 'The target of action.', hi: 'Karma (ko - को)' }
                ]
            };

            const particleDetails = {
                wa: { title: "Topic (は)", en_logic: "Highlights the main topic.", hi_logic: "Main topic set karta hai.", multitask: "Contrast marker." }
            };

            const kosoData = {
                item: { title: "Pronouns", bridgeEn: "This / That", bridgeHi: "Yeh / Woh", tip: "Kore, Sore, Are." }
            };

            const askSensei = async () => {
                if (!userInput.trim()) return;
                const msg = userInput;
                setUserInput('');
                setChatMessages(prev => [...prev, { role: 'user', text: msg }]);
                setIsTyping(true);

                const langLogic = bridge === 'hi' 
                    ? "Respond in short Hinglish."
                    : "Respond in short English.";

                const fullPrompt = `Instruction: You are Nihongono Sensei. ${langLogic} Focus on particles. User Question: ${msg}`;

                try {
                    // Using the "latest" tag which is the most compatible
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: fullPrompt }] }]
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(`${data.error.status}: ${data.error.message}`);
                    }

                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sensei is busy.";
                    setChatMessages(prev => [...prev, { role: 'ai', text: aiText }]);
                } catch (err) {
                    setChatMessages(prev => [...prev, { role: 'ai', text: `Sensei Error: ${err.message}` }]);
                } finally { setIsTyping(false); }
            };

            return (
                <div className="min-h-screen text-slate-900 pb-20">
                    <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-100 px-6 py-4 flex items-center justify-between">
                        <h1 className="text-xl font-black tracking-tighter">Nihongono <span className="text-rose-500">Sensei</span></h1>
                        <div className="flex gap-1 p-1 bg-slate-50 rounded-lg border border-slate-100">
                            <button onClick={() => setBridge('en')} className="text-[10px] px-3 py-1">EN</button>
                            <button onClick={() => setBridge('hi')} className="text-[10px] px-3 py-1">HI</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-4">
                        <div className="flex justify-center gap-2 mb-10">
                            <button onClick={() => setActiveTab('particles')} className="px-6 py-3 bg-slate-100 rounded-full text-xs font-bold">Particles</button>
                            <button onClick={() => setActiveTab('ai')} className="px-6 py-3 bg-indigo-600 text-white rounded-full text-xs font-bold">AI Lab</button>
                        </div>

                        {activeTab === 'ai' && (
                            <div className="h-[500px] bg-white rounded-3xl shadow-xl flex flex-col overflow-hidden">
                                <div className="flex-1 p-6 overflow-y-auto space-y-4 no-scrollbar">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-4 rounded-2xl text-sm ${m.role === 'user' ? 'bg-slate-900 text-white' : 'bg-slate-100'}`}>{m.text}</div>
                                        </div>
                                    ))}
                                    {isTyping && <p className="text-[10px] animate-pulse">SENSEI TYPING...</p>}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-4 border-t flex gap-2">
                                    <input type="text" value={userInput} onChange={e => setUserInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && askSensei()} className="flex-1 bg-slate-100 rounded-xl px-4 py-3 text-sm outline-none" />
                                    <button onClick={askSensei} className="bg-rose-500 text-white px-6 py-3 rounded-xl">Send</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
