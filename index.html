<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // Icon Component Wrapper for Lucide
        const Icon = ({ name, size = 16, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en'); 
            const [selectedKoso, setSelectedKoso] = useState('item');
            const [selectedParticle, setSelectedParticle] = useState('wa');
            const [chatMessages, setChatMessages] = useState([
                { role: 'ai', text: "Konnichiwa! I am your Sensei. I will explain Japanese using short, easy-to-read Hinglish or English logic. Ask me anything!" }
            ]);
            const [userInput, setUserInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);

            const apiKey = "AIzaSyDTRM2SWKlPmXz3q_UtnDNp7Xpjatg_a-0";

            const scrollToBottom = () => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => {
                scrollToBottom();
                if (window.lucide) window.lucide.createIcons();
            }, [chatMessages, activeTab]);

            const particleGroups = {
                "The Big Three": [
                    { p: 'wa', label: 'Topic', en: 'As for X...', hi: 'X ke baare mein...' },
                    { p: 'ga', label: 'Subject', en: 'The specific actor.', hi: 'Karta (ne - ने)' },
                    { p: 'o', label: 'Object', en: 'The target of action.', hi: 'Karma (ko - को)' }
                ],
                "Movement & Space": [
                    { p: 'ni', label: 'Target', en: 'At (time) / To (place).', hi: 'Sthan/Samay (me/ko)' },
                    { p: 'e', label: 'Direction', en: 'Towards.', hi: 'Ki taraf (की तरफ)' },
                    { p: 'de', label: 'Active Loc', en: 'At (location of action).', hi: 'Me/Se (में/से)' }
                ],
                "Relationships": [
                    { p: 'no', label: 'Possession', en: "X's Y.", hi: 'Ka/Ke/Ki (का/के/की)' },
                    { p: 'mo', label: 'Inclusion', en: 'Also / Too.', hi: 'Bhi (भी)' },
                    { p: 'to', label: 'Together', en: 'And / With.', hi: 'Aur / Saath (और)' },
                    { p: 'soshite', label: 'Connector', en: 'And then.', hi: 'Aur phir (और फिर)' }
                ]
            };

            const particleDetails = {
                wa: { title: "Topic Marker (は)", en_logic: "Sets the stage. Highlights the main topic.", hi_logic: "Main topic set karta hai. 'As for me...' (Main toh...).", multitask: "Contrast: Used to show difference between two things." },
                ga: { title: "Subject Marker (が)", en_logic: "Pinpoints the specific actor.", hi_logic: "Specific karta ko point karta hai.", multitask: "Introduces new information." },
                o: { title: "Object Marker (を)", en_logic: "Marks the direct object.", hi_logic: "Karma (object) ko point karta hai.", multitask: "Used when leaving a place." },
                ni: { title: "Target Marker (に)", en_logic: "Points to a static time or place.", hi_logic: "Sthan ya Samay ko point karta hai.", multitask: "Indicates the indirect object (Give TO friend)." },
                e: { title: "Directional Marker (へ)", en_logic: "Focuses on the journey direction.", hi_logic: "Disha dikhata hai. 'Ki taraf' jaisa.", multitask: "Used for travel verbs." },
                de: { title: "Context Marker (で)", en_logic: "Where action happens or tool used.", hi_logic: "Kriya kahan ya kisse ho rahi hai.", multitask: "Means 'by means of' (By bus/With spoon)." },
                mo: { title: "Inclusion Marker (も)", en_logic: "Means 'also' or 'too'.", hi_logic: "Hindi ke 'bhi' jaisa.", multitask: "Creates 'Everyone/Everything' words." },
                no: { title: "Linker (の)", en_logic: "Indicates possession.", hi_logic: "Ka/Ke/Ki (का/के/की).", multitask: "Acts as a placeholder for a noun (The blue one)." },
                to: { title: "Connector (と)", en_logic: "Means 'and' or 'with'.", hi_logic: "Aur (और) ya Saath (साथ).", multitask: "Used for quoting someone's words." },
                soshite: { title: "Conjunction (そして)", en_logic: "And then...", hi_logic: "Aur phir (और फिर).", multitask: "Connects two full sentences." }
            };

            const kosoData = {
                item: { title: "Kore / Sore / Are / Dore", bridgeEn: "This / That / That Over There / Which One", bridgeHi: "Yeh / Woh / Woh Door Wala / Kaunsa", tip: "Standalone pronouns." },
                place: { title: "Koko / Soko / Asoko / Doko", bridgeEn: "Here / There / Over There / Where", bridgeHi: "Yahan / Wahan / Wahan Door / Kahan", tip: "Locations." },
                adj: { title: "Kono / Sono / Ano / Dono", bridgeEn: "This [Noun] / That [Noun]", bridgeHi: "Yeh [Noun] / Woh [Noun]", tip: "Needs a noun! 'Kono hon'." }
            };

            const askSensei = async () => {
                if (!userInput.trim()) return;
                const msg = userInput;
                setUserInput('');
                setChatMessages(prev => [...prev, { role: 'user', text: msg }]);
                setIsTyping(true);

                const langLogic = bridge === 'hi' 
                    ? "Respond in short, bulleted Hinglish. Match particles to Hindi logic (wa=toh, o=ko, ga=ne)."
                    : "Respond in short, bulleted English. Clearly separate Translation and Grammar.";

                const systemPrompt = `You are Nihongono Sensei. ${langLogic} Focus on particles. Concise only.`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: msg }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sensei is confused. Try again!";
                    setChatMessages(prev => [...prev, { role: 'ai', text: aiText }]);
                } catch (err) {
                    setChatMessages(prev => [...prev, { role: 'ai', text: "Connection error. Try again!" }]);
                } finally { setIsTyping(false); }
            };

            return (
                <div className="min-h-screen bg-[#FDFCFD] text-slate-900 pb-20 font-sans">
                    <nav className="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-100 px-6 py-4 flex items-center justify-between">
                        <h1 className="text-xl font-black tracking-tighter">Nihongono <span className="text-rose-500">Sensei</span></h1>
                        <div className="flex gap-1 p-1 bg-slate-50 rounded-lg border border-slate-100">
                            <button onClick={() => setBridge('en')} className={`text-[10px] font-bold px-3 py-1 rounded ${bridge === 'en' ? 'bg-white shadow-sm' : 'text-slate-400'}`}>EN</button>
                            <button onClick={() => setBridge('hi')} className={`text-[10px] font-bold px-3 py-1 rounded ${bridge === 'hi' ? 'bg-white text-rose-500 shadow-sm' : 'text-slate-400'}`}>HI</button>
                        </div>
                    </nav>

                    <main className="max-w-6xl mx-auto p-4 md:p-10">
                        <div className="flex justify-center gap-2 mb-10 overflow-x-auto no-scrollbar pb-2">
                            <button onClick={() => setActiveTab('particles')} className={`px-6 py-3 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === 'particles' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-500'}`}>Particles</button>
                            <button onClick={() => setActiveTab('kosoado')} className={`px-6 py-3 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === 'kosoado' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-500'}`}>Do-Ko-A-So</button>
                            <button onClick={() => setActiveTab('ai')} className={`px-6 py-3 rounded-full text-[10px] font-black uppercase tracking-widest transition-all ${activeTab === 'ai' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>AI Lab</button>
                        </div>

                        {activeTab === 'particles' && (
                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                <div className="lg:col-span-2 space-y-6">
                                    {Object.entries(particleGroups).map(([name, items], i) => (
                                        <div key={i} className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden shadow-sm p-6">
                                            <h3 className="text-[10px] font-black text-rose-500 uppercase tracking-widest mb-4">{name}</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                {items.map((item, j) => (
                                                    <div key={j} onClick={() => setSelectedParticle(item.p)} className={`p-4 rounded-xl cursor-pointer transition-all border ${selectedParticle === item.p ? 'bg-rose-50 border-rose-200' : 'border-transparent hover:bg-slate-50'}`}>
                                                        <span className="text-xl font-black italic">{item.p}</span>
                                                        <p className="text-[10px] text-slate-400 uppercase font-bold">{item.label}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="bg-slate-900 text-white p-8 rounded-[2.5rem] sticky top-24 h-fit">
                                    <h3 className="text-3xl font-black text-rose-500 italic mb-2">{selectedParticle}</h3>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase mb-6">{particleDetails[selectedParticle].title}</p>
                                    <p className="text-sm leading-relaxed mb-6">{bridge === 'en' ? particleDetails[selectedParticle].en_logic : particleDetails[selectedParticle].hi_logic}</p>
                                    <div className="p-4 bg-white/5 rounded-2xl border border-white/10 text-xs text-slate-300">
                                        <strong>Tip:</strong> {particleDetails[selectedParticle].multitask}
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'kosoado' && (
                            <div className="bg-white rounded-[2.5rem] border border-slate-100 p-8 shadow-sm">
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                    {Object.keys(kosoData).map(k => (
                                        <div key={k} onClick={() => setSelectedKoso(k)} className={`p-6 rounded-[2rem] cursor-pointer border-2 transition-all ${selectedKoso === k ? 'border-rose-500 bg-rose-50' : 'border-slate-50'}`}>
                                            <h4 className="font-black text-lg mb-2">{kosoData[k].title}</h4>
                                            <p className="text-xs text-slate-500">{bridge === 'en' ? kosoData[k].bridgeEn : kosoData[k].bridgeHi}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'ai' && (
                            <div className="max-w-2xl mx-auto h-[500px] bg-white rounded-[2.5rem] shadow-xl border border-slate-100 flex flex-col">
                                <div className="flex-1 p-6 overflow-y-auto space-y-4 no-scrollbar">
                                    {chatMessages.map((m, i) => (
                                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-4 rounded-2xl text-sm max-w-[80%] ${m.role === 'user' ? 'bg-slate-900 text-white' : 'bg-slate-100'}`}>{m.text}</div>
                                        </div>
                                    ))}
                                    {isTyping && <p className="text-[10px] text-rose-500 animate-pulse font-bold">Sensei is typing...</p>}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-4 border-t flex gap-2">
                                    <input type="text" value={userInput} onChange={e => setUserInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && askSensei()} className="flex-1 bg-slate-100 rounded-xl px-4 py-3 text-sm outline-none" placeholder="Ask Sensei..." />
                                    <button onClick={askSensei} className="bg-rose-500 text-white p-3 rounded-xl">Send</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
