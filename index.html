<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Ultimate Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCFD; margin: 0; overflow-x: hidden; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); }
        .animate-zoom { animation: zoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoom { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .battle-gradient { background: linear-gradient(135deg, #0d9488 0%, #0f172a 100%); }
        .clock-gradient { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); }
        .logic-card { transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .logic-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05); }
        @media (max-width: 1024px) {
            .mobile-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #020617; display: flex; justify-content: space-around; padding: 12px; z-index: 100; border-top: 1px solid #1e293b; border-radius: 24px 24px 0 0; }
            main { margin-bottom: 100px; }
        }
        h1, h2, h3 { letter-spacing: -0.02em; }
        .builder-btn { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .builder-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [userName, setUserName] = useState(localStorage.getItem('nihongo_user') || '');
            const [tempName, setTempName] = useState('');
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en');
            const [selected, setSelected] = useState(null);
            const [builderStack, setBuilderStack] = useState([]);

            const handleNameSubmit = (e) => {
                e.preventDefault();
                if (tempName.trim()) {
                    localStorage.setItem('nihongo_user', tempName.trim());
                    setUserName(tempName.trim());
                }
            };

            const pEx = (text) => {
                if (!userName) return text;
                return text.replace(/Himanshu|User|Student|Japa/g, userName);
            };

            // --- DATA ENGINE ---
            const particleGroups = [
                { title: "Essential Basics", items: [
                    { p:'WA', label_en:'Topic Marker', label_hi:'Vishay Marker', logic_en:'Defines the context of the sentence.', logic_hi:'Sentence kis baare mein hai yeh batata hai.', cases: [
                        { label:'Identity', ex_en:'Watashi wa Himanshu desu. (I am Himanshu)', ex_hi:'Watashi wa Himanshu desu. (Main Himanshu hoon)' },
                        { label:'Fact', ex_en:'Nihon wa kirei desu. (Japan is beautiful)', ex_hi:'Nihon wa kirei desu. (Japan sundar hai)' }
                    ]},
                    { p:'GA', label_en:'Subject Marker', label_hi:'Karta Marker', logic_en:'Focuses on specific actor.', logic_hi:'Karta (actor) ko identify karta hai.', cases: [
                        { label:'Identify', ex_en:'Himanshu ga ikimasu. (Himanshu is going)', ex_hi:'Himanshu ga ikimasu. (Himanshu hi jaayega)' }
                    ]},
                    { p:'O', label_en:'Object Marker', label_hi:'Karma Marker', logic_en:'Marks target of action.', logic_hi:'Jispar kaam ho raha hai use mark karta hai.', cases: [
                        { label:'Action', ex_en:'Kohii o nomimasu. (Drink coffee)', ex_hi:'Kohii o nomimasu. (Coffee peena)' }
                    ]}
                ]},
                { title: "Connectors & Movement", items: [
                    { p:'NI', label_en:'Target/Time', label_hi:'Manzil/Samay', logic_en:'Goal or fixed time.', logic_hi:'Manzil ya pakka samay batata hai.', cases: [{ label:'Target', ex_en:'Kaisha ni ikimasu. (Go to office)', ex_hi:'Kaisha ni ikimasu. (Office jaana)' }] },
                    { p:'DE', label_en:'Action Marker', label_hi:'Kaam Sthan', logic_en:'Marks action location.', logic_hi:'Jahan kaam ho raha hai us jagah ko mark karta hai.', cases: [{ label:'Action', ex_en:'Uchi de tabemasu. (Eat at home)', ex_hi:'Uchi de tabemasu. (Ghar mein khana)' }] },
                    { p:'E', label_en:'Direction', label_hi:'Disha', logic_en:'Focus on journey direction.', logic_hi:'Yatra ki disha (direction) focus karta hai.', cases: [{ label:'Heading', ex_en:'Uchi e kaerimasu. (Heading home)', ex_hi:'Uchi e kaerimasu. (Ghar ki taraf jaana)' }] },
                    { p:'NO', label_en:'Linker', label_hi:'Malkiyat', logic_en:'Shows possession.', logic_hi:'Malkiyat (Ka/Ke/Ki) batata hai.', cases: [{ label:'Ownership', ex_en:'Watashi no pen. (My pen)', ex_hi:'Watashi no pen. (Mera pen)' }] },
                    { p:'KARA', label_en:'Start', label_hi:'Shuruat', logic_en:'Origin (From).', logic_hi:'Shuruat (Se) batata hai.', cases: [{ label:'From', ex_en:'Indo kara kita. (From India)', ex_hi:'Indo kara kita. (India se aaya)' }] },
                    { p:'MADE', label_en:'End', label_hi:'Ant', logic_en:'Ending point (Until).', logic_hi:'Ant (Tak) batata hai.', cases: [{ label:'Limit', ex_en:'Go-ji made. (Until 5)', ex_hi:'Go-ji made. (5 baje tak)' }] },
                    { p:'TO', label_en:'Companion', label_hi:'Saath', logic_en:'Companion/Lists.', logic_hi:'Saath ya list ke liye.', cases: [{ label:'With', ex_en:'Tanaka-san to hanasu. (Talk with Tanaka)', ex_hi:'Tanaka-san to hanasu. (Tanaka ke saath baat)' }] },
                    { p:'SOSHITE', label_en:'Sequence', label_hi:'Phir', logic_en:'"And then".', logic_hi:'Sentences ko "Aur phir" ki tarah jodta hai.', cases: [{ label:'Then', ex_en:'Tabemasu. Soshite nemasu. (Eat. Then sleep)', ex_hi:'Tabemasu. Soshite nemasu. (Khana. Phir sona)' }] }
                ]}
            ];

            const questionData = [
                { p: 'NAN / NANI', label_en: 'What', label_hi: 'Kya', logic_en: 'Universal "What".', logic_hi: '"Kya" poochne ke liye.', cases: [{ label: 'Object', ex_en: 'Sore wa NAN desu ka? (What is that?)', ex_hi: 'Sore wa NAN desu ka? (Woh kya hai?)' }] },
                { p: 'DARE / DONATA', label_en: 'Who', label_hi: 'Kaun', logic_en: 'Standard / Polite Who.', logic_hi: '"Kaun" poochne ke liye.', cases: [{ label: 'Person', ex_en: 'Dare desu ka? (Who is it?)', ex_hi: 'Dare desu ka? (Kaun hai?)' }] },
                { p: 'DOKO', label_en: 'Where', label_hi: 'Kahan', logic_en: 'Location.', logic_hi: 'Jagah poochne ke liye.', cases: [{ label: 'Place', ex_en: 'Doko desu ka? (Where is it?)', ex_hi: 'Doko desu ka? (Kahan hai?)' }] },
                { p: 'ITSU', label_en: 'When', label_hi: 'Kab', logic_en: 'Time.', logic_hi: 'Samay poochne ke liye.', cases: [{ label: 'Time', ex_en: 'Itsu desu ka? (When is it?)', ex_hi: 'Itsu desu ka? (Kab hai?)' }] }
            ];

            const multitaskers = [
                { p: 'NI vs DE', title: 'State vs Action', 
                  logic_en:'NI is for static existence (residing, being). DE is for where an active activity happens.', 
                  logic_hi:'NI bas hone ke liye (sthir rehna). DE wahan kuch karne ke liye (action).', 
                  stats: [ {l:'Location of Existence', v:40, c:'#f43f5e'}, {l:'Location of Action', v:60, c:'#0d9488'} ],
                  compare: [
                    { side:'NI', desc_en:'Static Existence', desc_hi:'Bas hona', cases: [{label:'Ex', ex_en:'Uchi ni imasu. (I am at home)', ex_hi:'Uchi ni imasu. (Main ghar par hoon)'}] },
                    { side:'DE', desc_en:'Active Action', desc_hi:'Kaam karna', cases: [{label:'Ex', ex_en:'Uchi de tabemasu. (I eat at home)', ex_hi:'Uchi de tabemasu. (Main ghar par khata hoon)'}] }
                ]},
                { p: 'NI vs E', title: 'Goal vs Path', 
                  logic_en:'NI marks the arrival destination. E focuses on the movement towards that destination.', 
                  logic_hi:'NI manzil ka point hai. E raste ki disha (direction) hai.', 
                  stats: [ {l:'Final Target Point', v:70, c:'#f59e0b'}, {l:'Direction focus', v:30, c:'#0d9488'} ],
                  compare: [
                    { side:'NI', desc_en:'Arrival Point', desc_hi:'Manzil focus', cases: [{label:'Ex', ex_en:'Tokyo ni taita. (Arrived in Tokyo)', ex_hi:'Tokyo ni taita. (Tokyo pahunch gaya)'}] },
                    { side:'E', desc_en:'Direction focus', desc_hi:'Disha focus', cases: [{label:'Ex', ex_en:'Tokyo e mukau. (Facing Tokyo)', ex_hi:'Tokyo e mukau. (Tokyo ki taraf)'}] }
                ]},
                { p: 'E vs DE', title: 'Path vs Place', 
                  logic_en:'E is the journey path. DE is the place where you stay and perform tasks.', 
                  logic_hi:'E rasta batata hai. DE kaam ki jagah batata hai.', 
                  stats: [ {l:'Path/Movement', v:50, c:'#8b5cf6'}, {l:'Action Site', v:50, c:'#0d9488'} ],
                  compare: [
                    { side:'E', desc_en:'Heading', desc_hi:'Taraf jaana', cases: [{label:'Ex', ex_en:'Kaisha e iku. (Heading to office)', ex_hi:'Kaisha e iku. (Office ki taraf jaana)'}] },
                    { side:'DE', desc_en:'Working', desc_hi:'Kaam karna', cases: [{label:'Ex', ex_en:'Kaisha de hataraku. (Work at office)', ex_hi:'Kaisha de hataraku. (Office mein kaam karna)'}] }
                ]}
            ];

            const kosoadoData = {
                kore: { logic_en: "This (near me)", logic_hi: "Yeh (mere paas)", ex_en: "Kore wa pen desu.", ex_hi: "Kore wa pen desu. (Yeh pen hai)" },
                sore: { logic_en: "That (near you)", logic_hi: "Woh (aapke paas)", ex_en: "Sore wa hon desu.", ex_hi: "Sore wa hon desu. (Woh kitaab hai)" },
                are: { logic_en: "That far", logic_hi: "Woh door", ex_en: "Are wa yama desu.", ex_hi: "Are wa yama desu. (Woh pahad hai)" },
                dore: { logic_en: "Which one?", logic_hi: "Kaunsa?", ex_en: "Dore desu ka?", ex_hi: "Dore desu ka? (Kaunsa?)" },
                koko: { logic_en: "Here", logic_hi: "Yahan", ex_en: "Koko wa Anand.", ex_hi: "Koko wa Anand. (Yahan Anand hai)" },
                soko: { logic_en: "There", logic_hi: "Wahan", ex_en: "Soko ni imasu.", ex_hi: "Soko ni imasu. (Wahan hai)" },
                asoko: { logic_en: "Over there", logic_hi: "Wahan door", ex_en: "Asoko desu.", ex_hi: "Asoko desu. (Wahan door hai)" },
                doko: { logic_en: "Where?", logic_hi: "Kahan?", ex_en: "Doko desu ka?", ex_hi: "Doko desu ka? (Kahan hai?)" },
                kono: { logic_en: "This [Noun]", logic_hi: "Yeh [Cheez]", ex_en: "Kono hon.", ex_hi: "Kono hon. (Yeh kitaab)" },
                sono: { logic_en: "That [Noun]", logic_hi: "Woh [Cheez]", ex_en: "Sono hito.", ex_hi: "Sono hito. (Woh insaan)" },
                ano: { logic_en: "That far [Noun]", logic_hi: "Woh door wali [Cheez]", ex_en: "Ano mise.", ex_hi: "Ano mise. (Woh door wali dukaan)" },
                dono: { logic_en: "Which [Noun]?", logic_hi: "Kaunsi [Cheez]?", ex_en: "Dono kasa?", ex_hi: "Dono kasa? (Kaunsa chhatra?)" },
                kochira: { logic_en: "This way", logic_hi: "Yeh disha", ex_en: "Kochira e.", ex_hi: "Kochira e. (Is taraf)" },
                sochira: { logic_en: "That way", logic_hi: "Woh disha", ex_en: "Sochira e.", ex_hi: "Sochira e. (Us taraf)" },
                achira: { logic_en: "That way far", logic_hi: "Wahan door", ex_en: "Achira desu.", ex_hi: "Achira desu. (Wahan door)" },
                dochira: { logic_en: "Which way?", logic_hi: "Kis taraf?", ex_en: "Dochira desu ka?", ex_hi: "Dochira desu ka? (Kis taraf?)" }
            };

            const kosoadoRows = [
                { title: "Things", row: ["kore", "sore", "are", "dore"], en: "Objects", hi: "Cheezein" },
                { title: "Places", row: ["koko", "soko", "asoko", "doko"], en: "Locations", hi: "Jagah" },
                { title: "Adjectives", row: ["kono", "sono", "ano", "dono"], en: "+ Noun", hi: "Noun chahiye" },
                { title: "Direction", row: ["kochira", "sochira", "achira", "dochira"], en: "Polite/Way", hi: "Disha" }
            ];

            const clockData = {
                hours: ['ichi-ji', 'ni-ji', 'san-ji', 'yo-ji ★', 'go-ji', 'roku-ji', 'shichi-ji ★', 'hachi-ji', 'ku-ji ★', 'juu-ji'],
                minutes: ['ippun ★', 'nifun', 'sanpun ★', 'yonpun ★', 'gofun', 'roppun ★', 'nanafun', 'happun ★', 'kyuufun', 'juppun ★'],
                markers: [{t:'GOZEN', m:'AM', hi:'Subah'},{t:'GOGO', m:'PM', hi:'Shaam'},{t:'GORO', m:'Around', hi:'Lagbhag'}]
            };

            const calendarData = {
                months: [{ m: 'Jan', r: 'Ichi-gatsu' }, { m: 'Feb', r: 'Ni-gatsu' }, { m: 'Mar', r: 'San-gatsu' }, { m: 'Apr', r: 'Shi-gatsu ★' }, { m: 'May', r: 'Go-gatsu' }, { m: 'Jun', r: 'Roku-gatsu' }, { m: 'Jul', r: 'Shichi-gatsu ★' }, { m: 'Aug', r: 'Hachi-gatsu' }, { m: 'Sep', r: 'Ku-gatsu ★' }, { m: 'Oct', r: 'Juu-gatsu' }, { m: 'Nov', r: 'Juuichi-gatsu' }, { m: 'Dec', r: 'Juuni-gatsu' }],
                weekdays: [{ d: 'Mon', r: 'Getsu-youbi', hi: 'Chandra-vaar' }, { d: 'Tue', r: 'Ka-youbi', hi: 'Agni-vaar' }, { d: 'Sun', r: 'Nichi-youbi', hi: 'Surya-vaar' }]
            };

            const basicNumbers = [
                { n: '1', r: 'ichi' }, { n: '2', r: 'ni' }, { n: '3', r: 'san' }, 
                { n: '4', r: 'shi / yon' }, { n: '5', r: 'go' }, { n: '6', r: 'roku' }, 
                { n: '7', r: 'shichi / nana' }, { n: '8', r: 'hachi' }, { n: '9', r: 'ku / kyuu' }, 
                { n: '10', r: 'juu' }, { n: '100', r: 'hyaku' }, { n: '1,000', r: 'sen' }, { n: '10,000', r: 'man' }
            ];

            const verbGroups = [
                { 
                    title: 'Group 1 (Godan)', logic_en: 'Change final "u" to "i" and add "masu".', logic_hi: '"u" hata kar "i" lagaye aur "masu" jode.',
                    verbs: [
                        { p:'Iku', label_en:'To Go', label_hi:'Jaana', polite:'Ikimasu', cases:[{label:'Usage', ex_en:'Kaisha ni ikimasu. (Go to office)', ex_hi:'Kaisha ni ikimasu. (Office jaana)'}]},
                        { p:'Nomu', label_en:'To Drink', label_hi:'Peena', polite:'Nomimasu', cases:[{label:'Usage', ex_en:'Mizu o nomimasu. (Drink water)', ex_hi:'Mizu o nomimasu. (Paani peena)'}]},
                        { p:'Kau', label_en:'To Buy', label_hi:'Khareedna', polite:'Kaimasu', cases:[{label:'Usage', ex_en:'Hon o kaimasu. (Buy a book)', ex_hi:'Hon o kaimasu. (Kitaab khareedna)'}]}
                    ]
                },
                { 
                    title: 'Group 2 (Ichidan)', logic_en: 'Simply drop final "ru" and add "masu".', logic_hi: 'Bas "ru" ko hata kar "masu" jode.',
                    verbs: [
                        { p:'Taberu', label_en:'To Eat', label_hi:'Khana', polite:'Tabemasu', cases:[{label:'Usage', ex_en:'Ranchi o tabemasu. (Eat lunch)', ex_hi:'Ranchi o tabemasu. (Lunch khana)'}]},
                        { p:'Miru', label_en:'To Watch', label_hi:'Dekhna', polite:'Mimasu', cases:[{label:'Usage', ex_en:'Eiga o mimasu. (Watch movie)', ex_hi:'Eiga o mimasu. (Movie dekhna)'}]}
                    ]
                },
                { 
                    title: 'Group 3 (Irregular)', logic_en: 'Memorize these fixed patterns.', logic_hi: 'In patterns ko yaad karna hota hai.',
                    verbs: [
                        { p:'Suru', label_en:'To Do', label_hi:'Karna', polite:'Shimasu', cases:[{label:'Usage', ex_en:'Benkyou o shimasu. (Study)', ex_hi:'Benkyou o shimasu. (Padhai karna)'}]},
                        { p:'Kuru', label_en:'To Come', label_hi:'Aana', polite:'Kimasu', cases:[{label:'Usage', ex_en:'Koko ni kimasu. (Come here)', ex_hi:'Koko ni kimasu. (Yahan aana)'}]}
                    ]
                }
            ];

            const builderAssets = {
                subjects: ['Watashi', 'Anata', 'Tanaka-san', 'Himanshu-san'],
                objects: ['Kohii', 'Hon', 'Mizu', 'Ranchi', 'Nihon'],
                particles: ['wa', 'ga', 'o', 'ni', 'de', 'e', 'no', 'mo', 'to', 'kara', 'made'],
                verbs: ['desu', 'ikimasu', 'tabemasu', 'nomimasu', 'kaimasu', 'shimasu']
            };

            const DonutChart = ({ data, size = "24" }) => {
                const total = data.reduce((acc, item) => acc + item.v, 0);
                let currentAngle = 0;
                const dimension = size === "24" ? 100 : 200;
                const radius = size === "24" ? 40 : 80;
                const stroke = size === "24" ? 12 : 24;
                const center = dimension / 2;
                const circumference = 2 * Math.PI * radius;

                return (
                    <svg viewBox={`0 0 ${dimension} ${dimension}`} className={`w-${size} h-${size} transform -rotate-90`}>
                        <circle cx={center} cy={center} r={radius} fill="transparent" stroke="#f1f5f9" strokeWidth={stroke} />
                        {data.map((item, i) => {
                            const ratio = item.v / total;
                            const dashArray = `${ratio * circumference} ${circumference}`;
                            const dashOffset = -currentAngle * circumference;
                            currentAngle += ratio;
                            return (
                                <circle key={i} cx={center} cy={center} r={radius} fill="transparent" stroke={item.c} strokeWidth={stroke} strokeDasharray={dashArray} strokeDashoffset={dashOffset} strokeLinecap="round" />
                            );
                        })}
                        <circle cx={center} cy={center} r={radius - stroke} fill="white" />
                    </svg>
                );
            };

            if (!userName) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-center">
                        <div className="max-w-md w-full bg-white rounded-[3.5rem] p-12 shadow-2xl animate-zoom">
                            <div className="w-20 h-20 bg-teal-500 rounded-3xl flex items-center justify-center text-white mx-auto mb-8 shadow-xl shadow-teal-500/20"><span className="material-icons text-4xl">face</span></div>
                            <h2 className="text-3xl font-black text-slate-900 uppercase italic leading-none">Sensei is Ready</h2>
                            <p className="text-slate-400 font-bold text-[11px] uppercase tracking-widest mt-4 mb-10">Japanese Language Mastery Lab</p>
                            <form onSubmit={handleNameSubmit} className="space-y-4">
                                <input type="text" placeholder="Enter Your Name..." className="w-full bg-slate-100 py-5 px-8 rounded-2xl text-lg font-bold outline-none text-center focus:ring-4 focus:ring-teal-500/10 border-2 border-transparent focus:border-teal-500/20" value={tempName} onChange={(e) => setTempName(e.target.value)} autoFocus />
                                <button className="w-full bg-teal-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-rose-600 transition-all">Start Experience</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    {/* SIDEBAR */}
                    <aside className="hidden lg:flex w-32 bg-slate-950 flex-col items-center py-10 fixed h-full z-50 shadow-2xl">
                        <div className="w-14 h-14 bg-teal-500 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg text-xl mb-12">N</div>
                        <nav className="flex flex-col gap-8 w-full px-2 text-center uppercase font-black text-[9px] tracking-widest">
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" label="Particles" onClick={() => setActiveTab('particles')} />
                            <SidebarBtn active={activeTab === 'questions'} icon="help_outline" label="Questions" onClick={() => setActiveTab('questions')} />
                            <SidebarBtn active={activeTab === 'builder'} icon="auto_fix_high" label="Builder" onClick={() => setActiveTab('builder')} />
                            <SidebarBtn active={activeTab === 'kosoado'} icon="map" label="Spatial" onClick={() => setActiveTab('kosoado')} />
                            <SidebarBtn active={activeTab === 'calendar'} icon="calendar_today" label="Calendar" onClick={() => setActiveTab('calendar')} />
                            <SidebarBtn active={activeTab === 'numbers'} icon="tag" label="Numbers" onClick={() => setActiveTab('numbers')} />
                            <SidebarBtn active={activeTab === 'verbs'} icon="bolt" label="Verbs" onClick={() => setActiveTab('verbs')} />
                        </nav>
                        <button onClick={() => {localStorage.removeItem('nihongo_user'); window.location.reload();}} className="mt-auto text-slate-600 hover:text-teal-400 mb-6 transition-colors"><span className="material-icons">logout</span></button>
                    </aside>

                    {/* MOBILE BOTTOM NAV */}
                    <div className="mobile-bottom-nav lg:hidden">
                        <SidebarBtn active={activeTab === 'particles'} icon="layers" label="Part." onClick={() => setActiveTab('particles')} />
                        <SidebarBtn active={activeTab === 'questions'} icon="help" label="Quest." onClick={() => setActiveTab('questions')} />
                        <SidebarBtn active={activeTab === 'builder'} icon="auto_fix_high" label="Build" onClick={() => setActiveTab('builder')} />
                        <SidebarBtn active={activeTab === 'numbers'} icon="tag" label="Num." onClick={() => setActiveTab('numbers')} />
                        <SidebarBtn active={activeTab === 'verbs'} icon="bolt" label="Verb" onClick={() => setActiveTab('verbs')} />
                    </div>

                    <main className="flex-1 lg:ml-32 pb-24">
                        <header className="sticky top-0 z-40 glass border-b border-slate-100 px-8 py-6 flex justify-between items-center">
                            <div className="flex flex-col">
                                <h1 className="text-xl lg:text-2xl font-black tracking-tighter text-slate-900 italic uppercase leading-none">Nihongono <span className="text-teal-600 font-black">Sensei</span></h1>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1 italic uppercase">Welcome, {userName}-san</p>
                            </div>
                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                                <button onClick={() => setBridge('en')} className={`px-5 py-2 rounded-lg text-[10px] font-black transition-all ${bridge === 'en' ? 'bg-white shadow-md text-slate-900' : 'text-slate-400'}`}>EN</button>
                                <button onClick={() => setBridge('hi')} className={`px-5 py-2 rounded-lg text-[10px] font-black transition-all ${bridge === 'hi' ? 'bg-white shadow-md text-teal-600' : 'text-slate-400'}`}>HI</button>
                            </div>
                        </header>

                        <div className="max-w-7xl mx-auto p-6 lg:p-12 space-y-20">
                            
                            {/* TAB: PARTICLES */}
                            {activeTab === 'particles' && (
                                <div className="space-y-20 animate-zoom">
                                    {particleGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-teal-500 pl-4">{group.title}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                                {group.items.map((item, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="logic-card group bg-white p-8 rounded-[2.5rem] text-left h-56 relative overflow-hidden flex flex-col justify-between">
                                                        <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-8xl italic uppercase leading-none">{item.p}</div>
                                                        <div className="relative z-10">
                                                            <p className="text-[10px] font-black text-teal-600 uppercase mb-1">{bridge === 'en' ? item.label_en : item.label_hi}</p>
                                                            <h3 className="text-3xl font-black text-slate-900 italic uppercase tracking-tighter">{item.p}</h3>
                                                        </div>
                                                        <p className="text-slate-500 font-extrabold text-xs relative z-10">{bridge === 'en' ? 'Learn' : 'Sikhein'}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-amber-500 pl-4">Logic Battles</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                            {multitaskers.map((mt, i) => (
                                                <button key={i} onClick={() => setSelected({type: 'multitask', data: mt})} className="battle-gradient p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group text-left transition-all hover:scale-[1.01] flex items-center justify-between">
                                                    <div className="relative z-10">
                                                        <p className="text-amber-400 font-black text-[10px] uppercase tracking-[0.2em]">{bridge === 'en' ? 'Logic Duel' : 'Muqabala'}</p>
                                                        <h3 className="text-4xl font-black text-white italic tracking-tighter uppercase">{mt.p.split(' ')[0]} <span className="text-xl font-normal opacity-50 italic">vs</span> {mt.p.split(' ').pop()}</h3>
                                                        <p className="mt-4 text-white/40 text-xs font-bold uppercase tracking-widest">Click to see usage chart</p>
                                                    </div>
                                                    <div className="relative z-10 bg-white/5 p-3 rounded-3xl backdrop-blur-sm">
                                                        <DonutChart data={mt.stats} />
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: SENTENCE BUILDER */}
                            {activeTab === 'builder' && (
                                <div className="space-y-12 animate-zoom">
                                    <div className="flex flex-col gap-2">
                                        <h2 className="text-3xl font-black text-slate-900 italic uppercase">Sentence Lab</h2>
                                        <p className="text-slate-400 text-sm font-bold uppercase tracking-widest">Build strings by clicking components</p>
                                    </div>
                                    
                                    <div className="bg-slate-950 p-10 rounded-[4rem] min-h-[180px] shadow-2xl flex flex-wrap items-center gap-4 border-4 border-teal-500/20 relative">
                                        <div className="absolute top-4 right-8 text-[10px] font-black text-teal-500 tracking-[0.3em] uppercase">The Draft Room</div>
                                        {builderStack.length === 0 ? (
                                            <p className="text-slate-600 font-black uppercase italic tracking-tighter text-2xl opacity-50 mx-auto">Start clicking elements below...</p>
                                        ) : (
                                            builderStack.map((word, idx) => (
                                                <button key={idx} onClick={() => setBuilderStack(prev => prev.filter((_, i) => i !== idx))} className="bg-white px-6 py-4 rounded-2xl text-slate-900 font-black text-xl italic shadow-xl hover:bg-rose-500 hover:text-white transition-all transform hover:-rotate-2">
                                                    {word}
                                                </button>
                                            ))
                                        )}
                                        {builderStack.length > 0 && <button onClick={() => setBuilderStack([])} className="ml-auto w-12 h-12 rounded-full bg-rose-500/20 text-rose-500 flex items-center justify-center hover:bg-rose-500 hover:text-white transition-all"><span className="material-icons">delete</span></button>}
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                                        {Object.entries(builderAssets).map(([category, items]) => (
                                            <div key={category} className="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm space-y-6">
                                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-widest border-b pb-4">{category}</p>
                                                <div className="flex flex-wrap gap-2">
                                                    {items.map(item => (
                                                        <button key={item} onClick={() => setBuilderStack(prev => [...prev, item])} className={`builder-btn px-4 py-3 rounded-xl font-bold text-xs uppercase tracking-tight border shadow-sm ${category === 'particles' ? 'bg-amber-50 text-amber-700 border-amber-100 hover:bg-amber-500' : category === 'verbs' ? 'bg-teal-50 text-teal-700 border-teal-100 hover:bg-teal-500' : 'bg-slate-50 text-slate-700 border-slate-100 hover:bg-slate-800'} hover:text-white`}>
                                                            {item}
                                                        </button>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB: QUESTIONS */}
                            {activeTab === 'questions' && (
                                <div className="space-y-10 animate-zoom">
                                    <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-teal-500 pl-4">Interrogatives</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                        {questionData.map((item, i) => (
                                            <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="logic-card group bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all text-left h-56 relative overflow-hidden flex flex-col justify-between">
                                                <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-8xl italic uppercase leading-none">{item.p.split(' ')[0]}</div>
                                                <div className="relative z-10">
                                                    <p className="text-[10px] font-black text-teal-600 uppercase mb-1">{bridge === 'en' ? item.label_en : item.label_hi}</p>
                                                    <h3 className="text-2xl lg:text-3xl font-black text-slate-900 italic uppercase tracking-tighter break-words max-w-[140px]">{item.p}</h3>
                                                </div>
                                                <p className="text-slate-500 font-extrabold text-xs relative z-10">{bridge === 'en' ? 'Usage' : 'Sikhein'}</p>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB: SPATIAL */}
                            {activeTab === 'kosoado' && (
                                <div className="animate-zoom bg-white rounded-[3rem] border border-slate-100 shadow-xl overflow-hidden">
                                    <div className="overflow-x-auto no-scrollbar">
                                        <table className="w-full text-left min-w-[800px]">
                                            <thead className="bg-slate-950 text-white text-[10px] uppercase font-black tracking-widest">
                                                <tr><th className="p-10">Type</th><th className="p-10 text-teal-400 italic">KO (Near Me)</th><th className="p-10 text-blue-400 italic">SO (Near You)</th><th className="p-10 text-emerald-400 italic">A (Far Both)</th><th className="p-10 text-amber-400 italic">DO (Which?)</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold uppercase italic text-sm">
                                                {kosoadoRows.map((obj, i) => (
                                                    <tr key={i} className="hover:bg-teal-50/50 transition-colors">
                                                        <td className="p-10 bg-slate-50 border-r border-slate-100"><p className="text-xs font-black text-slate-900 leading-none">{obj.title}</p><p className="text-[9px] mt-2 text-slate-300 tracking-widest">{bridge === 'en' ? obj.en : obj.hi}</p></td>
                                                        {obj.row.map((word, j) => (<td key={j} className="p-4"><button onClick={() => setSelected({type: 'spatial', id: word})} className="w-full py-8 rounded-2xl bg-white border border-slate-50 shadow-sm text-teal-600 font-black text-2xl tracking-tighter hover:bg-teal-50 transition-all">{word}</button></td>))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* TAB: NUMBERS */}
                            {activeTab === 'numbers' && (
                                <div className="space-y-12 animate-zoom">
                                    <div className="bg-white rounded-[3rem] p-10 shadow-xl border border-slate-100">
                                        <h2 className="text-teal-600 font-black text-2xl uppercase italic mb-8 border-l-4 border-teal-600 pl-4 uppercase">Basic Mastery</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                                            {basicNumbers.map((num, i) => (
                                                <div key={i} className="bg-slate-50 p-6 rounded-2xl border border-slate-100 text-center hover:bg-teal-50 transition-colors"><p className="text-3xl font-black text-slate-900">{num.n}</p><p className="text-[10px] font-bold text-slate-400 uppercase break-words">{num.r}</p></div>
                                            ))}
                                        </div>
                                    </div>
                                    <div className="clock-gradient rounded-[3rem] p-10 shadow-2xl text-white relative overflow-hidden text-center">
                                        <h2 className="text-amber-400 font-black text-2xl italic uppercase mb-10 tracking-tighter uppercase">Clock & Time</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 relative z-10">
                                            <div>
                                                <p className="text-white/40 font-black text-[10px] uppercase tracking-widest mb-6 border-b border-white/10 pb-2">Hours & AM/PM</p>
                                                <div className="grid grid-cols-5 gap-2 mb-8">{clockData.hours.map((h, i) => (<div key={i} className="bg-white/5 border border-white/10 p-3 rounded-xl"><p className={`text-[10px] font-bold ${h.includes('★') ? 'text-rose-400' : 'text-white'}`}>{h}</p></div>))}</div>
                                                <div className="flex gap-4">{clockData.markers.map((m, i) => (<div key={i} className="flex-1 bg-white/10 p-4 rounded-2xl border border-white/5 text-center"><p className="text-amber-400 font-black text-xs">{m.t}</p><p className="text-[10px] text-white/50">{bridge==='en'?m.m:m.hi}</p></div>))}</div>
                                            </div>
                                            <div>
                                                <p className="text-white/40 font-black text-[10px] uppercase tracking-widest mb-6 border-b border-white/10 pb-2">Minutes</p>
                                                <div className="grid grid-cols-2 gap-3">{clockData.minutes.map((m, i) => (<div key={i} className="bg-white/5 border border-white/10 px-4 py-2 rounded-2xl flex justify-between items-center"><span className="text-white/20 text-xs font-black">{i+1}m</span><span className={`text-xs font-black ${m.includes('★') ? 'text-teal-400 italic' : 'text-white'}`}>{m.replace(' ★', '')}</span></div>))}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* TAB: VERBS */}
                            {activeTab === 'verbs' && (
                                <div className="space-y-16 animate-zoom">
                                    {verbGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-rose-500 pl-4">{group.title} <span className="text-slate-300 ml-2 font-normal italic">/ {bridge === 'en' ? group.logic_en : group.logic_hi}</span></h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {group.verbs.map((v, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: {...v, p: v.p, logic_en: group.logic_en, logic_hi: group.logic_hi}})} className="group bg-white p-10 rounded-[2.5rem] border border-slate-100 shadow-sm text-left flex flex-col justify-between h-56 transition-all hover:shadow-xl">
                                                        <div className="relative z-10"><span className="text-[9px] font-black text-rose-500 uppercase tracking-widest">MASU: {v.polite}</span><h3 className="text-3xl font-black text-slate-900 italic mt-1 leading-none tracking-tighter uppercase">{v.p}</h3></div>
                                                        <p className="text-slate-400 font-extrabold text-sm uppercase italic">{bridge === 'en' ? v.label_en : v.label_hi}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL SYSTEM */}
                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md" onClick={() => setSelected(null)}>
                            <div className="relative bg-white w-full max-w-xl rounded-[4rem] p-10 lg:p-14 shadow-2xl animate-zoom overflow-y-auto max-h-[90vh] no-scrollbar" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelected(null)} className="absolute top-10 right-10 text-slate-300 hover:text-slate-900 transition-colors"><span className="material-icons text-3xl">close</span></button>
                                
                                {selected.type === 'multitask' && (
                                    <div className="space-y-10">
                                        <div className="bg-slate-900 p-8 rounded-[2.5rem] text-center italic text-amber-400 flex flex-col items-center">
                                            <h4 className="text-5xl font-black mb-6">{selected.data.p} Distribution</h4>
                                            <DonutChart data={selected.data.stats} size="48" />
                                        </div>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 italic border border-slate-100 leading-relaxed text-center">
                                            "{bridge === 'en' ? selected.data.logic_en : selected.data.logic_hi}"
                                        </div>
                                        <div className="grid grid-cols-1 gap-6">
                                            {selected.data.compare.map((item, j) => (
                                                <div key={j} className="p-6 bg-rose-50 border border-rose-100 rounded-[2rem] text-left">
                                                    <p className="text-rose-600 font-black text-[11px] uppercase mb-1 tracking-widest">{item.side}</p>
                                                    <p className="text-slate-800 font-bold text-base mb-4">{bridge === 'en' ? item.desc_en : item.desc_hi}</p>
                                                    <div className="space-y-3">
                                                        {item.cases.map((c, k) => (
                                                            <div key={k} className="bg-white/50 p-4 rounded-xl border border-rose-100">
                                                                <p className="text-slate-900 font-black italic text-lg leading-tight">"{pEx(bridge === 'en' ? c.ex_en : c.ex_hi)}"</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {selected.type === 'particle' && (
                                    <div className="space-y-8 text-center uppercase italic">
                                        <h4 className="text-8xl font-black text-teal-600 leading-none tracking-tighter break-words pr-4">{selected.data.p}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 leading-relaxed italic border border-slate-100">
                                            "{bridge === 'en' ? (selected.data.logic_en || selected.data.rule_en) : (selected.data.logic_hi || selected.data.rule_hi)}"
                                        </div>
                                        <div className="space-y-4">
                                            {selected.data.cases.map((c, i) => (
                                                <div key={i} className="p-10 bg-slate-950 text-white rounded-[3rem] shadow-xl shadow-teal-500/10 tracking-wide text-left relative overflow-hidden">
                                                    <p className="text-[10px] font-black text-teal-400 uppercase mb-3 tracking-widest italic">Case: {c.label}</p>
                                                    <p className="text-2xl font-black italic leading-tight">"{pEx(bridge === 'en' ? c.ex_en : c.ex_hi)}"</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {selected.type === 'spatial' && kosoadoData[selected.id] && (
                                    <div className="space-y-10">
                                        <h4 className="text-8xl font-black text-teal-600 italic tracking-tighter uppercase leading-none text-center">{selected.id}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl border border-slate-100 text-center italic">
                                            <p className="text-[10px] font-black text-teal-600 uppercase mb-3 tracking-widest italic">Sensei Rule</p>
                                            <p className="text-xl font-bold text-slate-700">"{bridge === 'en' ? kosoadoData[selected.id].logic_en : kosoadoData[selected.id].logic_hi}"</p>
                                        </div>
                                        <div className="p-10 bg-slate-950 text-white rounded-[2.5rem] shadow-xl italic font-black text-2xl leading-tight text-left italic">
                                            <p className="text-[10px] font-black text-teal-400 uppercase mb-3 tracking-widest italic">Usage Example</p>
                                            "{pEx(bridge === 'en' ? kosoadoData[selected.id].ex_en : kosoadoData[selected.id].ex_hi)}"
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SidebarBtn = ({ active, icon, label, onClick }) => (
            <button onClick={onClick} className={`w-full flex flex-col items-center py-4 rounded-3xl transition-all duration-300 ${active ? 'bg-teal-500 text-white shadow-xl shadow-teal-500/30' : 'text-slate-500 hover:text-slate-300'}`}>
                <span className="material-icons text-2xl lg:text-3xl">{icon}</span>
                <span className="text-[8px] font-black uppercase mt-1 tracking-widest">{label}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
