<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Ultimate Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCFD; margin: 0; overflow-x: hidden; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); }
        .animate-zoom { animation: zoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoom { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .battle-gradient { background: linear-gradient(135deg, #0d9488 0%, #0f172a 100%); }
        .clock-gradient { background: linear-gradient(135deg, #0f172a 0%, #334155 100%); }
        .logic-card { transition: all 0.3s ease; border: 1px solid #f1f5f9; cursor: pointer; }
        .logic-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05); }
        .chart-segment { transition: all 0.3s ease; cursor: pointer; }
        .chart-segment:hover { stroke-width: 26; opacity: 0.8; }
        @media (max-width: 1024px) {
            .mobile-bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #020617; display: flex; justify-content: space-around; padding: 12px; z-index: 100; border-top: 1px solid #1e293b; border-radius: 24px 24px 0 0; }
            main { margin-bottom: 100px; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [userName, setUserName] = useState(localStorage.getItem('nihongo_user') || '');
            const [tempName, setTempName] = useState('');
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en');
            const [selected, setSelected] = useState(null);
            const [chartFocus, setChartFocus] = useState(null);

            const handleNameSubmit = (e) => {
                e.preventDefault();
                if (tempName.trim()) {
                    localStorage.setItem('nihongo_user', tempName.trim());
                    setUserName(tempName.trim());
                }
            };

            const pEx = (text) => {
                if (!userName) return text;
                return text.replace(/Himanshu|User|Student|Japa/g, userName);
            };

            // --- DATA ENGINE: COMPREHENSIVE ---
            const particleGroups = [
                { title: "Basics", items: [
                    { p:'wa', label_en:'Topic Marker', label_hi:'Vishay Marker', logic_en:'Defines the topic. "As for...".', logic_hi:'Sentence kis baare mein hai.', cases: [{label:'Ex', ex_en:'Watashi wa Himanshu desu.', ex_hi:'Watashi wa Himanshu desu. (Main Himanshu hoon)'}]},
                    { p:'ga', label_en:'Subject Marker', label_hi:'Karta Marker', logic_en:'Highlights the subject. Answers "Who?".', logic_hi:'Karta ko identify karta hai.', cases: [{label:'Ex', ex_en:'Himanshu ga kimasu.', ex_hi:'Himanshu ga kimasu. (Himanshu aa raha hai)'}]},
                    { p:'o', label_en:'Object Marker', label_hi:'Karma Marker', logic_en:'Marks the target of the action.', logic_hi:'Jis cheez par kaam ho raha hai.', cases: [{label:'Ex', ex_en:'Kohii o nomimasu.', ex_hi:'Kohii o nomimasu. (Coffee peena)'}]}
                ]},
                { title: "Movement & Connection", items: [
                    { p:'ni', label_en:'Target/Time', label_hi:'Manzil/Samay', logic_en:'Specific time or goal point.', logic_hi:'Manzil ya pakka samay.', cases: [{label:'Ex', ex_en:'Nihon ni iku.', ex_hi:'Japan ni jaana.'}]},
                    { p:'de', label_en:'Action Place', label_hi:'Kaam Sthan', logic_en:'Location of activity.', logic_hi:'Kaam karne ki jagah.', cases: [{label:'Ex', ex_en:'Uchi de taberu.', ex_hi:'Ghar de khana.'}]},
                    { p:'e', label_en:'Direction', label_hi:'Disha', logic_en:'Heading direction.', logic_hi:'Yatra ki disha.', cases: [{label:'Ex', ex_en:'Uchi e kaeru.', ex_hi:'Ghar ki taraf jaana.'}]},
                    { p:'kara', label_en:'From', label_hi:'Se', logic_en:'Starting point.', logic_hi:'Shuruat ka point.', cases: [{label:'Ex', ex_en:'Indo kara.', ex_hi:'India kara.'}]},
                    { p:'made', label_en:'Until', label_hi:'Tak', logic_en:'Ending point.', logic_hi:'Ant ka point.', cases: [{label:'Ex', ex_en:'Go-ji made.', ex_hi:'5 baje tak.'}]}
                ]}
            ];

            const multitaskers = [
                { p: 'wa vs ga', title: 'Topic vs Subject', logic_en:'Wa is general info. Ga is specific identification/emphasis.', logic_hi:'Wa saamanya vishay hai. Ga vishisht karta par zor deta hai.', 
                  stats: [ {l:'General Topic', v:50, c:'#8b5cf6', desc:'Context setting'}, {l:'Subject Emphasis', v:50, c:'#ec4899', desc:'Identifier'} ],
                  compare: [{ side:'wa', desc_en:'Old info', desc_hi:'Puraani jankari', cases: [{label:'Ex', ex_en:'Watashi wa Himanshu desu.', ex_hi:'Watashi wa Himanshu hoon.'}]}, { side:'ga', desc_en:'New info', desc_hi:'Nayi jankari', cases: [{label:'Ex', ex_en:'Himanshu ga Sensei desu.', ex_hi:'Himanshu hi Sensei hai.'}]}]
                },
                { p: 'ni vs de', title: 'State vs Action', logic_en:'Ni is for being (living/sitting). De is for doing (working/studying).', logic_hi:'Ni sthir rehne ke liye. De kaam karne ke liye.', 
                  stats: [ {l:'Existence', v:40, c:'#f43f5e', desc:'Living/Being'}, {l:'Active Event', v:60, c:'#0d9488', desc:'Doing/Activity'} ],
                  compare: [{ side:'ni', desc_en:'State', desc_hi:'Rehna', cases: [{label:'Ex', ex_en:'Uchi ni iru.', ex_hi:'Ghar mein hona.'}]}, { side:'de', desc_en:'Action', desc_hi:'Kaam', cases: [{label:'Ex', ex_en:'Uchi de taberu.', ex_hi:'Ghar mein khana.'}]}]
                },
                { p: 'ni vs e', title: 'Goal vs Path', logic_en:'Ni is the arrival spot. E is the act of heading there.', logic_hi:'Ni manzil hai. E disha hai.', 
                  stats: [ {l:'Arrival Target', v:70, c:'#f59e0b', desc:'Arriving at'}, {l:'Travel Heading', v:30, c:'#10b981', desc:'Heading to'} ],
                  compare: [{ side:'ni', desc_en:'Arrival', desc_hi:'Pahunchna', cases: [{label:'Ex', ex_en:'Tokyo ni taita.', ex_hi:'Tokyo pahunch gaya.'}]}, { side:'e', desc_en:'Heading', desc_hi:'Disha', cases: [{label:'Ex', ex_en:'Tokyo e mukau.', ex_hi:'Tokyo ki taraf.'}]}]
                }
            ];

            const kosoadoData = {
                kore: { logic_en: "Close to the speaker (this).", logic_hi: "Bolne wale ke paas (yeh).", ex_en: "Kore wa pen.", ex_hi: "Kore wa pen desu. (Yeh pen hai)" },
                sore: { logic_en: "Close to the listener (that).", logic_hi: "Sunne wale ke paas (woh).", ex_en: "Sore wa kagi?", ex_hi: "Sore wa kagi? (Woh chabi hai?)" },
                are: { logic_en: "Far from both (that over there).", logic_hi: "Dono se door (woh door).", ex_en: "Are wa yama.", ex_hi: "Are wa yama desu. (Woh pahad hai)" },
                dore: { logic_en: "Interrogative: Which one?", logic_hi: "Kaunsa?", ex_en: "Dore ga ii?", ex_hi: "Dore ga ii? (Kaunsa achha hai?)" },
                koko: { logic_en: "Speaker's location (here).", logic_hi: "Vartaman jagah (yahan).", ex_en: "Koko wa Anand.", ex_hi: "Koko wa Anand." },
                doko: { logic_en: "Location Interrogative (where).", logic_hi: "Kahan?", ex_en: "Doko desu ka?", ex_hi: "Doko desu ka? (Kahan hai?)" },
                kochira: { logic_en: "Polite/Direction (this way).", logic_hi: "Izzat wali disha (is taraf).", ex_en: "Kochira e douzo.", ex_hi: "Kochira e douzo. (Is taraf aaiye)" },
                aa: { logic_en: "Manner: In that distant way.", logic_hi: "Uss door waale tarike se.", ex_en: "Aa shimasu ka?", ex_hi: "Aa shimasu ka? (Waise karenge?)" }
            };

            const kosoadoRows = [
                { title: "Things", row: ["kore", "sore", "are", "dore"], en: "Objects", hi: "Cheezein" },
                { title: "Places", row: ["koko", "soko", "asoko", "doko"], en: "Locations", hi: "Jagah" },
                { title: "Adjectives", row: ["kono", "sono", "ano", "dono"], en: "+ Noun", hi: "Noun chahiye" },
                { title: "Direction", row: ["kochira", "sochira", "achira", "dochira"], en: "Polite/Way", hi: "Disha" },
                { title: "Manner", row: ["kou", "sou", "aa", "dou"], en: "Like this", hi: "Iss tarah" }
            ];

            const clockData = {
                hours: ['ichi-ji', 'ni-ji', 'san-ji', 'yo-ji ★', 'go-ji', 'roku-ji', 'shichi-ji ★', 'hachi-ji', 'ku-ji ★', 'juu-ji'],
                minutes: ['ippun ★', 'nifun', 'sanpun ★', 'yonpun ★', 'gofun', 'roppun ★', 'nanafun', 'happun ★', 'kyuufun', 'juppun ★'],
                markers: [{t:'Gozen', m:'AM', hi:'Subah'},{t:'Gogo', m:'PM', hi:'Shaam'},{t:'Goro', m:'Around', hi:'Lagbhag'}]
            };

            const calendarData = {
                months: [{m:'Jan', r:'Ichi-gatsu'}, {m:'Feb', r:'Ni-gatsu'}, {m:'Mar', r:'San-gatsu'}, {m:'Apr', r:'Shi-gatsu ★'}, {m:'May', r:'Go-gatsu'}, {m:'Jun', r:'Roku-gatsu'}, {m:'Jul', r:'Shichi-gatsu ★'}, {m:'Aug', r:'Hachi-gatsu'}, {m:'Sep', r:'Ku-gatsu ★'}, {m:'Oct', r:'Juu-gatsu'}, {m:'Nov', r:'Juuichi-gatsu'}, {m:'Dec', r:'Juuni-gatsu'}],
                weekdays: [{d:'Mon', r:'Getsu-youbi', hi:'Chandra'}, {d:'Tue', r:'Ka-youbi', hi:'Agni'}, {d:'Wed', r:'Sui-youbi', hi:'Jal'}, {d:'Thu', r:'Moku-youbi', hi:'Lakdi'}, {d:'Fri', r:'Kin-youbi', hi:'Sona'}, {d:'Sat', r:'Do-youbi', hi:'Matti'}, {d:'Sun', r:'Nichi-youbi', hi:'Surya'}],
                relative: [
                    {p:'Kyou', label_en:'Today', label_hi:'Aaj', logic_en:'Current day.', cases:[{label:'Ex', ex_en:'Kyou wa atsui.', ex_hi:'Kyou wa atsui.'}]},
                    {p:'Ashita', label_en:'Tomorrow', label_hi:'Kal', logic_en:'Coming day.', cases:[{label:'Ex', ex_en:'Ashita kimasu.', ex_hi:'Ashita aaunga.'}]},
                    {p:'Kinou', label_en:'Yesterday', label_hi:'Beeta kal', logic_en:'Previous day.', cases:[{label:'Ex', ex_en:'Kinou shimashita.', ex_hi:'Kal kiya tha.'}]},
                    {p:'Senshuu', label_en:'Last Week', label_hi:'Pichla hafta', logic_en:'Week before.', cases:[{label:'Ex', ex_en:'Senshuu ikimashita.', ex_hi:'Pichle hafte gaya.'}]},
                    {p:'Konshuu', label_en:'This Week', label_hi:'Yeh hafta', logic_en:'Current week.', cases:[{label:'Ex', ex_en:'Konshuu isogashii.', ex_hi:'Iss hafte busy hoon.'}]}
                ]
            };

            const basicNumbers = [{n:'1', r:'ichi'},{n:'2', r:'ni'},{n:'3', r:'san'},{n:'4', r:'shi/yon'},{n:'5', r:'go'},{n:'6', r:'roku'},{n:'7', r:'shichi/nana'},{n:'8', r:'hachi'},{n:'9', r:'ku/kyuu'},{n:'10', r:'juu'},{n:'100', r:'hyaku'},{n:'1,000', r:'sen'},{n:'10,000', r:'man'}];

            const verbGroups = [
                { title: 'Group 1', logic_en: 'Change u to i + masu.', logic_hi: 'u hata kar i + masu jode.', verbs: [{p:'Iku', polite:'Ikimasu', label_en:'Go', label_hi:'Jaana'}, {p:'Nomu', polite:'Nomimasu', label_en:'Drink', label_hi:'Peena'}, {p:'Kau', polite:'Kaimasu', label_en:'Buy', label_hi:'Khareedna'}] },
                { title: 'Group 2', logic_en: 'Drop ru + masu.', logic_hi: 'ru hata kar masu jode.', verbs: [{p:'Taberu', polite:'Tabemasu', label_en:'Eat', label_hi:'Khana'}, {p:'Miru', polite:'Mimasu', label_en:'Watch', label_hi:'Dekhna'}, {p:'Neru', polite:'Nemasu', label_en:'Sleep', label_hi:'Sona'}] },
                { title: 'Group 3', logic_en: 'Irregular fixed pairs.', logic_hi: 'Fix patterns.', verbs: [{p:'Suru', polite:'Shimasu', label_en:'Do', label_hi:'Karna'}, {p:'Kuru', polite:'Kimasu', label_en:'Come', label_hi:'Aana'}] }
            ];

            const DonutChart = ({ data, onHover }) => {
                const total = data.reduce((acc, item) => acc + item.v, 0);
                let currentAngle = 0;
                return (
                    <svg viewBox="0 0 200 200" className="w-24 h-24 transform -rotate-90">
                        <circle cx="100" cy="100" r="80" fill="transparent" stroke="#f1f5f9" strokeWidth="20" />
                        {data.map((item, i) => {
                            const ratio = item.v / total;
                            const dashArray = `${ratio * 502.4} 502.4`;
                            const dashOffset = -currentAngle * 502.4;
                            currentAngle += ratio;
                            return (
                                <circle key={i} className="chart-segment" cx="100" cy="100" r="80" fill="transparent" stroke={item.c} strokeWidth="20" 
                                    strokeDasharray={dashArray} strokeDashoffset={dashOffset} strokeLinecap="round" 
                                    onMouseEnter={() => onHover && onHover(item)} onMouseLeave={() => onHover && onHover(null)} />
                            );
                        })}
                    </svg>
                );
            };

            if (!userName) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-white rounded-[3.5rem] p-12 shadow-2xl animate-zoom text-center">
                            <div className="w-20 h-20 bg-teal-500 rounded-3xl flex items-center justify-center text-white mx-auto mb-8 shadow-xl"><span className="material-icons text-4xl">face</span></div>
                            <h2 className="text-3xl font-black text-slate-900">Konnichiwa!</h2>
                            <p className="text-slate-400 font-bold text-[11px] uppercase tracking-widest mt-4 mb-10">Sensei is ready for you</p>
                            <form onSubmit={handleNameSubmit} className="space-y-4">
                                <input type="text" placeholder="Enter Name..." className="w-full bg-slate-100 py-5 px-8 rounded-2xl text-lg font-bold outline-none text-center focus:ring-4 focus:ring-teal-500/10" value={tempName} onChange={(e) => setTempName(e.target.value)} autoFocus />
                                <button className="w-full bg-teal-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest shadow-xl hover:bg-rose-600 transition-all">Start Experience</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    {/* SIDEBAR */}
                    <aside className="hidden lg:flex w-32 bg-slate-950 flex-col items-center py-10 fixed h-full z-50 shadow-2xl">
                        <div className="w-14 h-14 bg-teal-500 rounded-2xl flex items-center justify-center text-white font-black text-xl mb-12">N</div>
                        <nav className="flex flex-col gap-6 w-full px-2 text-center font-black text-[9px] tracking-widest uppercase">
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" label="Particles" onClick={() => setActiveTab('particles')} />
                            <SidebarBtn active={activeTab === 'kosoado'} icon="map" label="Spatial" onClick={() => setActiveTab('kosoado')} />
                            <SidebarBtn active={activeTab === 'calendar'} icon="calendar_today" label="Calendar" onClick={() => setActiveTab('calendar')} />
                            <SidebarBtn active={activeTab === 'numbers'} icon="tag" label="Numbers" onClick={() => setActiveTab('numbers')} />
                            <SidebarBtn active={activeTab === 'verbs'} icon="bolt" label="Verbs" onClick={() => setActiveTab('verbs')} />
                        </nav>
                        <button onClick={() => {localStorage.removeItem('nihongo_user'); window.location.reload();}} className="mt-auto text-slate-600 hover:text-teal-400 mb-6 transition-colors"><span className="material-icons">logout</span></button>
                    </aside>

                    <div className="mobile-bottom-nav lg:hidden">
                        <SidebarBtn active={activeTab === 'particles'} icon="layers" label="Part." onClick={() => setActiveTab('particles')} />
                        <SidebarBtn active={activeTab === 'kosoado'} icon="map" label="Spat." onClick={() => setActiveTab('kosoado')} />
                        <SidebarBtn active={activeTab === 'calendar'} icon="calendar_today" label="Cal." onClick={() => setActiveTab('calendar')} />
                        <SidebarBtn active={activeTab === 'numbers'} icon="tag" label="Num." onClick={() => setActiveTab('numbers')} />
                        <SidebarBtn active={activeTab === 'verbs'} icon="bolt" label="Verb" onClick={() => setActiveTab('verbs')} />
                    </div>

                    <main className="flex-1 lg:ml-32 pb-24 text-left">
                        <header className="sticky top-0 z-40 glass border-b border-slate-100 px-8 py-6 flex justify-between items-center">
                            <div><h1 className="text-xl lg:text-2xl font-black text-slate-900">Nihongono <span className="text-teal-600">Sensei</span></h1><p className="text-[10px] font-black text-slate-400 tracking-widest">Welcome, {userName}-san</p></div>
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                <button onClick={() => setBridge('en')} className={`px-5 py-2 rounded-lg text-[10px] font-black transition-all ${bridge === 'en' ? 'bg-white shadow-md text-slate-900' : 'text-slate-400'}`}>EN</button>
                                <button onClick={() => setBridge('hi')} className={`px-5 py-2 rounded-lg text-[10px] font-black transition-all ${bridge === 'hi' ? 'bg-white shadow-md text-teal-600' : 'text-slate-400'}`}>HI</button>
                            </div>
                        </header>

                        <div className="max-w-7xl mx-auto p-6 lg:p-12 space-y-20">
                            {activeTab === 'particles' && (
                                <div className="space-y-20 animate-zoom">
                                    {particleGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 border-l-4 border-teal-500 pl-4 uppercase">{group.title}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                                {group.items.map((item, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="logic-card group bg-white p-8 rounded-[2.5rem] flex flex-col justify-between h-56 relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-8xl leading-none uppercase">{item.p}</div>
                                                        <div className="relative z-10 text-left"><p className="text-[10px] font-black text-teal-600 uppercase mb-1">{bridge === 'en' ? item.label_en : item.label_hi}</p><h3 className="text-3xl font-black text-slate-900">{item.p}</h3></div>
                                                        <p className="text-slate-400 font-extrabold text-xs relative z-10">Detailed Rules</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 border-l-4 border-rose-500 pl-4 uppercase text-left">Logic Face-offs</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                            {multitaskers.map((mt, i) => (
                                                <button key={i} onClick={() => setSelected({type: 'multitask', data: mt})} className="battle-gradient p-10 rounded-[3rem] shadow-2xl transition-all hover:scale-[1.01] flex items-center justify-between">
                                                    <div className="relative z-10 text-white text-left"><p className="text-rose-400 font-black text-[10px] uppercase tracking-[0.2em]">{bridge === 'en' ? 'Logic Duel' : 'Muqabala'}</p><h3 className="text-4xl font-black uppercase">{mt.p.split(' ')[0]} <span className="text-xl font-normal opacity-50 px-1">vs</span> {mt.p.split(' ').pop()}</h3><p className="mt-4 text-white/40 text-xs font-bold uppercase">Usage Analysis</p></div>
                                                    <div className="relative z-10 bg-white/5 p-2 rounded-3xl backdrop-blur-sm"><DonutChart data={mt.stats} /></div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'kosoado' && (
                                <div className="animate-zoom bg-white rounded-[3rem] border border-slate-100 shadow-xl overflow-hidden text-left">
                                    <div className="overflow-x-auto no-scrollbar">
                                        <table className="w-full text-left min-w-[800px]">
                                            <thead className="bg-slate-950 text-white text-[10px] uppercase font-black tracking-widest text-left">
                                                <tr><th className="p-10 text-left">Type</th><th className="p-10 text-teal-400">KO (Near Me)</th><th className="p-10 text-blue-400">SO (Near You)</th><th className="p-10 text-emerald-400">A (Far)</th><th className="p-10 text-rose-400">DO (Which?)</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 font-bold text-sm text-left">
                                                {kosoadoRows.map((obj, i) => (
                                                    <tr key={i} className="hover:bg-teal-50/50 transition-colors">
                                                        <td className="p-10 bg-slate-50 border-r border-slate-100 text-left"><p className="text-xs font-black text-slate-900 leading-none mb-1">{obj.title}</p><p className="text-[9px] text-slate-300 uppercase tracking-widest">{bridge === 'en' ? obj.en : obj.hi}</p></td>
                                                        {obj.row.map((word, j) => (<td key={j} className="p-4 text-left"><button onClick={() => setSelected({type: 'spatial', id: word})} className="w-full py-8 rounded-2xl bg-white border border-slate-50 shadow-sm text-teal-600 font-black text-2xl hover:bg-teal-50 transition-all uppercase pl-4">{word}</button></td>))}
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'calendar' && (
                                <div className="space-y-12 animate-zoom text-left text-sm">
                                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                        <div className="bg-slate-900 p-10 rounded-[3rem] shadow-2xl text-white">
                                            <h2 className="text-amber-400 font-black text-2xl mb-8 border-l-4 border-amber-400 pl-4 uppercase">All Months</h2>
                                            <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                                {calendarData.months.map((m, i) => (<div key={i} className="bg-white/5 border border-white/10 p-4 rounded-xl flex justify-between font-bold"><span>{m.m}</span><span className="text-amber-400">{m.r}</span></div>))}
                                            </div>
                                        </div>
                                        <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-xl">
                                            <h2 className="text-teal-600 font-black text-2xl mb-8 border-l-4 border-teal-600 pl-4 uppercase">Weekdays</h2>
                                            <div className="space-y-3">
                                                {calendarData.weekdays.map((w, i) => (<div key={i} className="flex justify-between p-4 bg-slate-50 rounded-xl font-bold uppercase"><span>{w.r}</span><span className="text-slate-300">{w.hi}</span></div>))}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 border-l-4 border-rose-500 pl-4 uppercase">Timeline Markers</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-5 gap-6">
                                            {calendarData.relative.map((item, i) => (<button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="logic-card bg-white p-8 rounded-[2.5rem] h-48 flex flex-col justify-center items-center"><p className="text-2xl font-black text-slate-900">{item.p}</p><p className="text-[10px] font-black text-rose-500 uppercase tracking-widest mt-2">{bridge === 'en' ? item.label_en : item.label_hi}</p></button>))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'numbers' && (
                                <div className="space-y-12 animate-zoom">
                                    <div className="bg-white rounded-[3rem] p-10 shadow-xl border border-slate-100 text-left">
                                        <h2 className="text-teal-600 font-black text-2xl mb-8 border-l-4 border-teal-600 pl-4 uppercase">Full Numbers sequence</h2>
                                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                                            {basicNumbers.map((num, i) => (<div key={i} className="bg-slate-50 p-6 rounded-2xl border border-slate-100 hover:bg-teal-50 transition-colors"><p className="text-3xl font-black text-slate-900 mb-1">{num.n}</p><p className="text-[10px] font-bold text-slate-400 uppercase break-words">{num.r}</p></div>))}
                                        </div>
                                    </div>
                                    <div className="clock-gradient rounded-[3rem] p-10 shadow-2xl text-white relative overflow-hidden text-left">
                                        <h2 className="text-amber-400 font-black text-2xl mb-10 uppercase tracking-tighter">Clock & Time phases</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 relative z-10 text-left">
                                            <div className="text-left">
                                                <p className="text-white/40 font-black text-[10px] uppercase tracking-widest mb-6 border-b border-white/10 pb-2">Hours & AM/PM</p>
                                                <div className="grid grid-cols-5 gap-2 mb-8">{clockData.hours.map((h, i) => (<div key={i} className="bg-white/5 border border-white/10 p-3 rounded-xl text-center"><p className={`text-[10px] font-bold ${h.includes('★') ? 'text-rose-400' : 'text-white'}`}>{h}</p></div>))}</div>
                                                <div className="flex gap-4">{clockData.markers.map((m, i) => (<div key={i} className="flex-1 bg-white/10 p-4 rounded-2xl border border-white/5 text-center"><p className="text-amber-400 font-black text-xs uppercase">{m.t}</p><p className="text-[10px] text-white/50 uppercase">{bridge==='en'?m.m:m.hi}</p></div>))}</div>
                                            </div>
                                            <div className="text-left">
                                                <p className="text-white/40 font-black text-[10px] uppercase tracking-widest mb-6 border-b border-white/10 pb-2">Minutes</p>
                                                <div className="grid grid-cols-2 gap-3">{clockData.minutes.map((m, i) => (<div key={i} className="bg-white/5 border border-white/10 px-4 py-2 rounded-2xl flex justify-between items-center text-left"><span className="text-white/20 text-xs font-black">{i+1}m</span><span className={`text-xs font-black ${m.includes('★') ? 'text-teal-400' : 'text-white'}`}>{m.replace(' ★', '')}</span></div>))}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'verbs' && (
                                <div className="space-y-16 animate-zoom text-left">
                                    {verbGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6 text-left">
                                            <h2 className="text-2xl font-black text-slate-900 border-l-4 border-rose-500 pl-4 uppercase">{group.title}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 text-left">
                                                {group.verbs.map((v, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: {...v, logic_en: group.logic_en, logic_hi: group.logic_hi}})} className="logic-card bg-white p-10 rounded-[2.5rem] border flex flex-col justify-between h-56 transition-all hover:shadow-xl relative overflow-hidden">
                                                        <div className="absolute -bottom-4 -right-4 p-4 text-slate-50 font-black text-8xl leading-none uppercase">{v.p[0]}</div>
                                                        <div className="relative z-10 text-left"><span className="text-[9px] font-black text-rose-500 uppercase tracking-widest">MASU: {v.polite}</span><h3 className="text-3xl font-black text-slate-900 mt-2 leading-none tracking-tighter uppercase">{v.p}</h3></div>
                                                        <p className="text-slate-400 font-extrabold text-sm uppercase">{bridge === 'en' ? v.label_en : v.label_hi}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </main>

                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md animate-zoom text-left" onClick={() => setSelected(null)}>
                            <div className="relative bg-white w-full max-w-2xl rounded-[4rem] p-10 lg:p-14 shadow-2xl overflow-y-auto max-h-[90vh] no-scrollbar text-left" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelected(null)} className="absolute top-10 right-10 text-slate-300 hover:text-slate-900"><span className="material-icons text-3xl">close</span></button>
                                
                                {selected.type === 'multitask' && (
                                    <div className="space-y-10 text-left">
                                        <div className="bg-slate-900 p-10 rounded-[3.5rem] flex flex-col items-center text-center">
                                            <h4 className="text-4xl font-black text-amber-400 mb-8 uppercase tracking-tighter">{selected.data.p} Nuance analysis</h4>
                                            <DonutChart data={selected.data.stats} size="48" onHover={(item) => setChartFocus(item)} />
                                            <div className="mt-8 grid grid-cols-2 gap-4 w-full">
                                                {selected.data.stats.map((s,i)=><div key={i} className={`p-4 rounded-2xl transition-all border-2 ${chartFocus === s ? 'bg-white/10 border-white/20' : 'border-transparent'}`}><div className="flex items-center gap-2 text-[10px] font-black text-white uppercase justify-center"><div className="w-2.5 h-2.5 rounded-full" style={{backgroundColor:s.c}}></div>{s.l}</div><p className="text-white/60 text-[10px] mt-1 italic uppercase font-bold text-center">{s.desc}</p></div>)}
                                            </div>
                                        </div>
                                        <div className="p-8 bg-slate-50 rounded-3xl border text-base font-bold text-slate-700 italic text-left">"{bridge === 'en' ? selected.data.logic_en : selected.data.logic_hi}"</div>
                                        {selected.data.compare.map((item, j) => (
                                            <div key={j} className="p-8 bg-slate-950 text-white rounded-[3rem] text-left">
                                                <p className="text-rose-400 font-black text-[10px] uppercase mb-4 tracking-widest">{item.side}: {bridge === 'en' ? item.desc_en : item.desc_hi}</p>
                                                {item.cases.map((c, k) => <p key={k} className="text-2xl font-black italic text-left leading-tight mb-2">"{pEx(bridge === 'en' ? c.ex_en : c.ex_hi)}"</p>)}
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {selected.type === 'particle' && (
                                    <div className="space-y-8 text-left">
                                        <h4 className="text-7xl font-black text-teal-600 tracking-tighter break-words uppercase text-left">{selected.data.p}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl border font-bold text-xl text-slate-700 italic text-left">"{bridge === 'en' ? (selected.data.logic_en || selected.data.rule_en) : (selected.data.logic_hi || selected.data.rule_hi)}"</div>
                                        {selected.data.cases.map((c, i) => (
                                            <div key={i} className="p-10 bg-slate-950 text-white rounded-[3.5rem] text-left relative overflow-hidden">
                                                <p className="text-[10px] font-black text-teal-400 uppercase mb-3 tracking-widest text-left">Logic Case {i+1}: {c.label}</p>
                                                <p className="text-2xl font-black italic text-left leading-tight mb-2">"{pEx(bridge === 'en' ? c.ex_en : c.ex_hi)}"</p>
                                            </div>
                                        ))}
                                    </div>
                                )}

                                {selected.type === 'spatial' && kosoadoData[selected.id] && (
                                    <div className="space-y-10 text-left">
                                        <h4 className="text-8xl font-black text-teal-600 tracking-tighter uppercase text-center">{selected.id}</h4>
                                        <div className="p-10 bg-slate-50 rounded-[3rem] border text-left">
                                            <p className="text-[10px] font-black text-teal-600 uppercase mb-3 tracking-widest text-left">Sensei Perspective</p>
                                            <p className="text-xl font-bold text-slate-700 leading-relaxed text-left">"{bridge === 'en' ? kosoadoData[selected.id].logic_en : kosoadoData[selected.id].logic_hi}"</p>
                                        </div>
                                        <div className="p-12 bg-slate-950 text-white rounded-[4rem] text-left italic font-black text-3xl leading-tight">
                                            <p className="text-[10px] font-black text-teal-400 uppercase mb-4 tracking-widest text-left">Example context</p>
                                            "{pEx(bridge === 'en' ? kosoadoData[selected.id].ex_en : kosoadoData[selected.id].ex_hi)}"
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SidebarBtn = ({ active, icon, label, onClick }) => (
            <button onClick={onClick} className={`w-full flex flex-col items-center py-4 rounded-3xl transition-all duration-300 ${active ? 'bg-teal-500 text-white shadow-xl shadow-teal-500/30' : 'text-slate-500 hover:text-slate-300'}`}>
                <span className="material-icons text-2xl lg:text-3xl">{icon}</span>
                <span className="text-[8px] font-black uppercase mt-1 tracking-widest text-center">{label}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
