<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nihongono Sensei | Master Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFCFD; margin: 0; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(14px); }
        .animate-zoom { animation: zoom 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes zoom { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .battle-gradient { background: linear-gradient(135deg, #134e4a 0%, #0f172a 100%); }
        .clock-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            const [userName, setUserName] = useState(localStorage.getItem('nihongo_user') || '');
            const [tempName, setTempName] = useState('');
            const [activeTab, setActiveTab] = useState('particles');
            const [bridge, setBridge] = useState('en');
            const [selected, setSelected] = useState(null);

            const handleNameSubmit = (e) => {
                e.preventDefault();
                if (tempName.trim()) {
                    const name = tempName.trim();
                    localStorage.setItem('nihongo_user', name);
                    setUserName(name);
                }
            };

            const pEx = (text) => {
                if (!userName) return text;
                return text.replace(/Himanshu|Tanaka-san|User|Student|Japa/g, `${userName}-san`);
            };

            // --- DATA ENGINE: PARTICLES WITH DUAL USE CASES ---
            const particleGroups = [
                { title: "Essential Basics", items: [
                    {
                        p:'WA', label:'Topic', 
                        logic_en:'Marks the main topic. Sets the stage.', 
                        logic_hi:'Vishay ko mark karta hai. Sentence isi ke baare mein hai.', 
                        cases: [
                            { label: 'Name/ID', ex_en: 'Watashi WA Himanshu desu. (I am Himanshu)', ex_hi: 'Watashi WA Himanshu desu. (Main Himanshu hoon)' },
                            { label: 'General Fact', ex_en: 'Nihon WA kirei desu. (Japan is beautiful)', ex_hi: 'Nihon WA kirei desu. (Japan sundar hai)' }
                        ]
                    },
                    {
                        p:'GA', label:'Subject', 
                        logic_en:'Identifies the specific actor. Focuses on WHO.', 
                        logic_hi:'Karta ko identify karta hai. "Kaun" par zor deta hai.', 
                        cases: [
                            { label: 'Identifying', ex_en: 'Himanshu GA ikimasu. (Himanshu is the one going)', ex_hi: 'Himanshu GA ikimasu. (Himanshu hi jaa raha hai)' },
                            { label: 'Existence', ex_en: 'Terebi GA arimasu. (There is a TV)', ex_hi: 'Terebi GA arimasu. (TV wahan hai)' }
                        ]
                    },
                    {
                        p:'O', label:'Object', 
                        logic_en:'Connects action to the object being used/eaten.', 
                        logic_hi:'Kriya aur karma ko jodta hai.', 
                        cases: [
                            { label: 'Consumption', ex_en: 'Kohii O nomimasu. (Drink coffee)', ex_hi: 'Kohii O nomimasu. (Coffee peena)' },
                            { label: 'General Action', ex_en: 'Hon O yomimasu. (Read a book)', ex_hi: 'Hon O yomimasu. (Kitaab padhna)' }
                        ]
                    }
                ]},
                { title: "Movement & Direction", items: [
                    {
                        p:'NI', label:'Target', 
                        logic_en:'Marks destination or a specific time.', 
                        logic_hi:'Manzil ya samay ko mark karta hai.', 
                        cases: [
                            { label: 'Destination', ex_en: 'Nihon NI ikimasu. (Going to Japan)', ex_hi: 'Nihon NI ikimasu. (Japan jaa raha hoon)' },
                            { label: 'Time Point', ex_en: 'Go-ji NI nemasu. (Sleep at 5:00)', ex_hi: 'Go-ji NI nemasu. (5 baje sona)' }
                        ]
                    },
                    {
                        p:'E', label:'Heading', 
                        logic_en:'Focuses on the direction/journey.', 
                        logic_hi:'Yatra ki disha (direction) par zor.', 
                        cases: [
                            { label: 'Direction', ex_en: 'Uchi E kaerimasu. (Heading home)', ex_hi: 'Uchi E kaerimasu. (Ghar ki taraf jaana)' },
                            { label: 'Poetic Path', ex_en: 'Kita E iku. (Going North)', ex_hi: 'Kita E iku. (Uttar ki taraf jaana)' }
                        ]
                    }
                ]}
            ];

            const multitaskers = [
                { 
                    p: 'NI vs DE', title: 'Static vs Active', 
                    logic_en: 'NI for existence/staying. DE for active events/tasks.', 
                    logic_hi: 'NI rehne/hone ke liye. DE kaam karne ke liye.', 
                    compare: [
                        { side:'NI', desc_en:'Existing/Staying', desc_hi:'Hona/Baithna', cases: [{label:'Location', ex_en:'Uchi NI imasu. (At home)', ex_hi:'Ghar NI hona'}] },
                        { side:'DE', desc_en:'Activity/Action', desc_hi:'Kaam/Activity', cases: [{label:'Action', ex_en:'Uchi DE taberu. (Eat at home)', ex_hi:'Ghar DE khana'}] }
                    ] 
                },
                { 
                    p: 'WA vs GA', title: 'Info vs Actor', 
                    logic_en: 'WA for general facts. GA to identify the specific one.', 
                    logic_hi: 'WA jaankari ke liye. GA pehchaan (Kaun?) ke liye.', 
                    compare: [
                        { side:'WA', desc_en:'General Topic', desc_hi:'Sadharan Vishay', cases: [{label:'Fact', ex_en:'Inu WA kawaii. (Dogs are cute)', ex_hi:'Kutta WA pyaara hai'}] },
                        { side:'GA', desc_en:'Subject Focus', desc_hi:'Karta focus', cases: [{label:'Identification', ex_en:'Inu GA kita! (THE dog came)', ex_hi:'Kutta GA aaya'}] }
                    ] 
                }
            ];

            // --- REMAINING DATA ENGINE: CALENDAR & NUMBERS ---
            const calendarData = {
                months: [
                    { m: 'Jan', r: 'Ichi-gatsu' }, { m: 'Feb', r: 'Ni-gatsu' }, { m: 'Mar', r: 'San-gatsu' }, { m: 'Apr', r: 'Shi-gatsu ★' },
                    { m: 'May', r: 'Go-gatsu' }, { m: 'Jun', r: 'Roku-gatsu' }, { m: 'Jul', r: 'Shichi-gatsu ★' }, { m: 'Aug', r: 'Hachi-gatsu' },
                    { m: 'Sep', r: 'Ku-gatsu ★' }, { m: 'Oct', r: 'Juu-gatsu' }, { m: 'Nov', r: 'Juuichi-gatsu' }, { m: 'Dec', r: 'Juuni-gatsu' }
                ],
                weekdays: [
                    { d: 'Mon', r: 'Getsu-youbi', en: 'Moon', hi: 'Chandra' }, { d: 'Tue', r: 'Ka-youbi', en: 'Fire', hi: 'Agni' },
                    { d: 'Wed', r: 'Sui-youbi', en: 'Water', hi: 'Jal' }, { d: 'Thu', r: 'Moku-youbi', en: 'Wood', hi: 'Lakdi' },
                    { d: 'Fri', r: 'Kin-youbi', en: 'Gold', hi: 'Sona' }, { d: 'Sat', r: 'Do-youbi', en: 'Earth', hi: 'Prithvi' },
                    { d: 'Sun', r: 'Nichi-youbi', en: 'Sun', hi: 'Surya' }
                ]
            };

            const clockData = {
                hours: ['ichi-ji', 'ni-ji', 'san-ji', 'yo-ji ★', 'go-ji', 'roku-ji', 'shichi-ji ★', 'hachi-ji', 'ku-ji ★', 'juu-ji'],
                minutes: ['ippun ★', 'nifun', 'sanpun ★', 'yonpun ★', 'gofun', 'roppun ★', 'nanafun', 'happun ★', 'kyuufun', 'juppun ★']
            };

            if (!userName) {
                return (
                    <div className="min-h-screen bg-slate-950 flex items-center justify-center p-6 text-center">
                        <div className="max-w-md w-full bg-white rounded-[3.5rem] p-12 shadow-2xl animate-zoom">
                            <div className="w-20 h-20 bg-teal-500 rounded-3xl flex items-center justify-center text-white mx-auto mb-8 shadow-xl shadow-teal-500/20"><span className="material-icons text-4xl">face</span></div>
                            <h2 className="text-3xl font-black text-slate-900 uppercase italic">Konnichiwa!</h2>
                            <p className="text-slate-400 font-bold text-[11px] uppercase tracking-widest mt-4 mb-10">Personalize your learning lab</p>
                            <form onSubmit={handleNameSubmit} className="space-y-4">
                                <input type="text" placeholder="Enter Name..." className="w-full bg-slate-100 py-5 px-8 rounded-2xl text-lg font-bold outline-none text-center focus:ring-4 focus:ring-teal-500/10" value={tempName} onChange={(e) => setTempName(e.target.value)} autoFocus />
                                <button className="w-full bg-teal-600 text-white py-5 rounded-2xl font-black uppercase shadow-xl hover:bg-rose-600 transition-all">Start Experience</button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col lg:flex-row">
                    <aside className="hidden lg:flex w-32 bg-slate-950 flex-col items-center py-10 fixed h-full z-50 shadow-2xl">
                        <div className="w-14 h-14 bg-teal-500 rounded-2xl flex items-center justify-center text-white font-black italic shadow-lg text-xl mb-12">N</div>
                        <nav className="flex flex-col gap-6 w-full px-2 text-center">
                            <SidebarBtn active={activeTab === 'particles'} icon="layers" label="Particles" onClick={() => setActiveTab('particles')} />
                            <SidebarBtn active={activeTab === 'calendar'} icon="calendar_today" label="Calendar" onClick={() => setActiveTab('calendar')} />
                            <SidebarBtn active={activeTab === 'numbers'} icon="tag" label="Numbers" onClick={() => setActiveTab('numbers')} />
                        </nav>
                        <button onClick={() => {localStorage.removeItem('nihongo_user'); window.location.reload();}} className="mt-auto text-slate-600 hover:text-teal-400 mb-6 transition-colors"><span className="material-icons">logout</span></button>
                    </aside>

                    <main className="flex-1 lg:ml-32 pb-24">
                        <header className="sticky top-0 z-40 glass border-b border-slate-100 px-8 py-6 flex justify-between items-center">
                            <div><h1 className="text-xl lg:text-2xl font-black tracking-tighter text-slate-900 italic uppercase leading-none">Nihongono <span className="text-teal-600 font-black">Sensei</span></h1><p className="text-[10px] font-black text-slate-400 uppercase tracking-widest mt-1 italic">Welcome, {userName}-san</p></div>
                            <div className="flex bg-slate-100 p-1 rounded-xl">
                                <button onClick={() => setBridge('en')} className={`px-5 py-2 rounded-lg text-[10px] font-black transition-all ${bridge === 'en' ? 'bg-white shadow-md text-slate-900' : 'text-slate-400'}`}>EN</button>
                                <button onClick={() => setBridge('hi')} className={`px-5 py-2 rounded-lg text-[10px] font-black transition-all ${bridge === 'hi' ? 'bg-white shadow-md text-teal-600' : 'text-slate-400'}`}>HI</button>
                            </div>
                        </header>

                        <div className="max-w-7xl mx-auto p-6 lg:p-12 space-y-20">
                            {activeTab === 'particles' && (
                                <div className="space-y-20 animate-zoom">
                                    {particleGroups.map((group, idx) => (
                                        <div key={idx} className="space-y-6">
                                            <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-teal-500 pl-4">{group.title}</h2>
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                                {group.items.map((item, i) => (
                                                    <button key={i} onClick={() => setSelected({type: 'particle', data: item})} className="group bg-white p-8 rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-xl transition-all text-left h-56 relative overflow-hidden flex flex-col justify-between">
                                                        <div className="absolute top-0 right-0 p-10 text-slate-50 font-black text-8xl italic uppercase leading-none">{item.p}</div>
                                                        <div className="relative z-10"><p className="text-[10px] font-black text-teal-600 uppercase mb-1">{item.label}</p><h3 className="text-4xl font-black text-slate-900 italic uppercase tracking-tighter">{item.p}</h3></div>
                                                        <p className="text-slate-500 font-extrabold text-xs relative z-10">{bridge === 'en' ? 'Deep Logic' : 'Puri Baat'}</p>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                    <div className="space-y-6">
                                        <h2 className="text-2xl font-black text-slate-900 italic uppercase border-l-4 border-amber-500 pl-4">Face-Off Battles</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                                            {multitaskers.map((mt, i) => (
                                                <button key={i} onClick={() => setSelected({type: 'multitask', data: mt})} className="battle-gradient p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group text-left transition-all hover:scale-[1.01]">
                                                    <div className="absolute -right-6 -top-6 text-white/5 text-[150px] font-black italic leading-none">{mt.p.split(' ')[0]}</div>
                                                    <div className="relative z-10 space-y-4">
                                                        <p className="text-amber-400 font-black text-[10px] uppercase tracking-[0.2em]">{mt.title}</p>
                                                        <h3 className="text-4xl font-black text-white italic tracking-tighter uppercase">{mt.p}</h3>
                                                    </div>
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'numbers' && (
                                <div className="space-y-12 animate-zoom">
                                    <div className="clock-gradient rounded-[3rem] p-10 shadow-2xl text-white relative overflow-hidden">
                                        <h2 className="text-amber-400 font-black text-2xl italic uppercase mb-10 tracking-tighter">Clock Mastery</h2>
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-12 relative z-10">
                                            <div>
                                                <p className="text-white/40 font-black text-[10px] uppercase tracking-widest border-b border-white/10 pb-2 mb-6 tracking-tighter">Hours (Ji)</p>
                                                <div className="grid grid-cols-5 gap-2">{clockData.hours.map((h, i) => (<div key={i} className="bg-white/5 border border-white/10 p-3 rounded-xl text-center"><p className="text-white/20 text-[8px] font-black">{i+1}</p><p className={`text-[10px] font-bold ${h.includes('★') ? 'text-rose-400' : 'text-white'}`}>{h.split(' ')[0]}</p></div>))}</div>
                                            </div>
                                            <div>
                                                <p className="text-white/40 font-black text-[10px] uppercase tracking-widest border-b border-white/10 pb-2 mb-6 tracking-tighter">Minutes (Pun/Fun)</p>
                                                <div className="grid grid-cols-2 gap-3">{clockData.minutes.map((m, i) => (<div key={i} className="bg-white/5 border border-white/10 px-4 py-2 rounded-2xl flex justify-between items-center"><span className="text-white/20 text-xs font-black">{i+1}m</span><span className={`text-xs font-black ${m.includes('★') ? 'text-teal-400 italic' : 'text-white'}`}>{m.replace(' ★', '')}</span></div>))}</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {activeTab === 'calendar' && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-zoom">
                                    <div className="bg-slate-900 p-10 rounded-[3rem] shadow-2xl text-white">
                                        <h2 className="text-amber-400 font-black text-2xl uppercase italic mb-8 border-l-4 border-amber-400 pl-4">Months</h2>
                                        <div className="grid grid-cols-2 gap-3">
                                            {calendarData.months.map((m, i) => (<div key={i} className="bg-white/5 border border-white/10 p-4 rounded-xl font-bold flex justify-between"><span>{m.m}</span><span>{m.r}</span></div>))}
                                        </div>
                                    </div>
                                    <div className="bg-white p-10 rounded-[3rem] border border-slate-100 shadow-xl">
                                        <h2 className="text-teal-600 font-black text-2xl uppercase italic mb-8 border-l-4 border-teal-600 pl-4">Weekdays</h2>
                                        <div className="space-y-3">
                                            {calendarData.weekdays.map((w, i) => (<div key={i} className="flex justify-between p-4 bg-slate-50 rounded-xl font-black italic uppercase"><span>{w.r}</span><span className="text-slate-300 tracking-widest text-[10px]">{bridge === 'en' ? w.en : w.hi}</span></div>))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL SYSTEM */}
                    {selected && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-slate-950/80 backdrop-blur-md" onClick={() => setSelected(null)}>
                            <div className="relative bg-white w-full max-w-xl rounded-[4rem] p-12 lg:p-16 shadow-2xl animate-zoom overflow-y-auto max-h-[90vh] no-scrollbar" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelected(null)} className="absolute top-10 right-10 text-slate-300 hover:text-slate-900 transition-colors"><span className="material-icons text-3xl">close</span></button>
                                
                                {selected.type === 'multitask' && (
                                    <div className="space-y-10">
                                        <div className="bg-slate-900 p-8 rounded-[2.5rem] text-center italic">
                                            <h4 className="text-6xl font-black text-amber-400 tracking-tighter uppercase">{selected.data.p}</h4>
                                        </div>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 italic border border-slate-100 leading-relaxed text-center">
                                            "{bridge === 'en' ? selected.data.logic_en : selected.data.logic_hi}"
                                        </div>
                                        <div className="grid grid-cols-1 gap-6">
                                            {selected.data.compare.map((item, j) => (
                                                <div key={j} className="p-6 bg-rose-50 border border-rose-100 rounded-[2rem] text-left">
                                                    <p className="text-rose-600 font-black text-[11px] uppercase mb-1 tracking-widest">{item.side}</p>
                                                    <p className="text-slate-800 font-bold text-base mb-4">{bridge === 'en' ? item.desc_en : item.desc_hi}</p>
                                                    <div className="space-y-3">
                                                        {item.cases.map((c, k) => (
                                                            <div key={k} className="bg-white/50 p-4 rounded-xl border border-rose-100">
                                                                <p className="text-[9px] font-black text-rose-400 uppercase mb-1 tracking-tighter italic">Case: {c.label}</p>
                                                                <p className="text-slate-900 font-black italic text-lg leading-tight">"{pEx(bridge === 'en' ? c.ex_en : c.ex_hi)}"</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}

                                {selected.type === 'particle' && (
                                    <div className="space-y-8 text-center uppercase italic">
                                        <h4 className="text-8xl font-black text-teal-600 leading-none tracking-tighter">{selected.data.p}</h4>
                                        <div className="p-8 bg-slate-50 rounded-3xl font-bold text-xl text-slate-700 leading-relaxed italic border border-slate-100">
                                            "{bridge === 'en' ? selected.data.logic_en : selected.data.logic_hi}"
                                        </div>
                                        <div className="space-y-4">
                                            {selected.data.cases.map((c, i) => (
                                                <div key={i} className="p-10 bg-slate-950 text-white rounded-[3rem] shadow-xl shadow-teal-500/10 tracking-wide text-left relative overflow-hidden">
                                                    <div className="absolute right-0 top-0 p-6 opacity-10 text-[60px] font-black">{i+1}</div>
                                                    <p className="text-[10px] font-black text-teal-400 uppercase mb-3 tracking-widest">Case: {c.label}</p>
                                                    <p className="text-3xl font-black italic leading-tight">"{pEx(bridge === 'en' ? c.ex_en : c.ex_hi)}"</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const SidebarBtn = ({ active, icon, label, onClick }) => (
            <button onClick={onClick} className={`w-full flex flex-col items-center py-4 rounded-3xl transition-all duration-300 ${active ? 'bg-teal-500 text-white shadow-xl shadow-teal-500/30' : 'text-slate-500 hover:text-slate-300'}`}>
                <span className="material-icons text-2xl">{icon}</span>
                <span className="text-[8px] font-black uppercase mt-2 tracking-widest">{label}</span>
            </button>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
